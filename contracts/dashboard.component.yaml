# Bản mô tả thành phần bảng điều hành theo contracts/component.schema.json; `make check-fast` kiểm tệp này. Mã của
# thành phần ở platform/web/src/ (DashboardPanel.tsx, DashboardView.tsx, dashboardConfig.ts); luật cấu hình theo gói
# ở scripts/check-dashboard-config.py. Đổi hành vi của thành phần thì sửa tệp này trong cùng pull request.

component: dashboard
summary: Các khối thẻ số và biểu đồ cột ngang theo cấu hình của gói, đọc qua GraphQL, API quy trình hay API dữ liệu thiết bị bằng token người xem; khối chính hiện số lớn trên cùng, mỗi khối có mục "Xem cách tính" thu gọn ghi cách tính và nguồn để người xem đối chiếu.
config_schema: dashboard.schema.json
example: examples/dashboard.example.yaml
capabilities:
  - Mỗi khối đọc một bảng hay view qua Hasura (graphql.field) bằng token của người xem, lọc được theo một cột bằng một giá trị (graphql.where).
  - Nguồn workflow với counts tenant hiện số hồ sơ của một quy trình trong đơn vị của người xem do workflow-api đếm (GET /v1/workflow/processes/{process}/counts) - còn mở, đã kết thúc, bước quá hạn, và theo từng bước - không có biến, mã hồ sơ hay tên người; chỉ người có vai trò của một bước của quy trình nhận được số, nên khối thường khai role (ADR 0035).
  - Nguồn workflow với counts mine hiện số việc đang chờ chính người xem của một quy trình, đếm trên trình duyệt từ GET /v1/workflow/tasks, tổng hay theo bước, quá hạn là việc có hạn trước lúc tải; khối tự ghi "Số việc đang chờ bạn" để người xem không nhầm với số của cả đơn vị.
  - Nguồn context hiện số đo mới nhất của các thiết bị của đơn vị (GET /v1/context/entities với type, attrs, limit), mỗi thiết bị có số đo đó một dòng gồm id, value, observedAt; thiết bị thiếu số đo đó không có dòng, không có dòng nào thì khối báo "Chưa có số đo".
  - Trang xếp các khối theo lưới; khối chính (primary, tối đa một, là thẻ số) hiện đầu tiên, rộng cả hàng, số cỡ lớn; khối khai size half chiếm nửa hàng trên màn hình rộng, màn hình hẹp mọi khối rộng cả hàng.
  - Dưới tiêu đề khối chỉ có description, viết bằng lời của người xem; make check-fast từ chối tiêu đề, mô tả, nhãn có tên bảng, view, cột, vai trò, giá trị mã hay tên snake_case mà cấu hình dùng (ADR 0045).
  - Thẻ số (cards) hiện từng cột của đúng một dòng mà nguồn trả, kèm nhãn và đơn vị; nguồn không trả dòng nào thì báo "Chưa có số liệu", trả nhiều hơn một dòng thì báo cấu hình sai thay vì chọn đại một dòng.
  - Biểu đồ cột ngang (chart, type bar) vẽ mỗi dòng một nhóm, tối đa bốn cột số chung một thang, màu theo bảng màu của theme; mỗi thanh ghi số của nó, giá trị 0 vẫn có vạch ngắn và số 0, dưới các thanh có thang từ 0 tới số lớn nhất. Luôn kèm bảng số liệu có chú thích trong mục "Xem bảng số liệu" mở ra được, đủ cho người dùng trình đọc màn hình và để đối chiếu, gồm cả các cột chỉ để đọc (chart.details); bảng rộng thì cuộn ngang trong khung nhận focus. Với nguồn context, thanh ghi nhãn trong chart.x.choices hay nhãn trục kèm số thứ tự thay cho mã entity; mã gốc nằm trong bảng.
  - Số, dù đến dạng số hay chuỗi thập phân, viết theo kiểu Việt Nam (dấu chấm ngăn hàng nghìn, dấu phẩy thập phân); format integer làm tròn tới hàng đơn vị.
  - Mỗi khối có một mục "Xem cách tính" mở ra được, gồm method của khối, cách tính của từng thẻ (description của thẻ) và phần "Nguồn" gồm loại nguồn, bảng, các cột, vai trò đã dùng và nguyên văn câu truy vấn cùng biến đã gửi; khối nguồn REST ghi đường dẫn đã gửi và cách đếm (thời điểm đếm, phần đếm trên trình duyệt).
  - Khối khai role chỉ được truy vấn và chỉ hiện khi token của người xem có vai trò đó; truy vấn luôn gửi kèm header X-Hasura-Role (bỏ trống là user) và luôn đọc lại từ máy chủ.
  - Hasura từ chối câu truy vấn vì cấu hình (validation-failed, data-exception) thì khối báo bằng tiếng Việt, nêu vai trò đã dùng, cột của where và dẫn tới người quản trị sửa cấu hình của gói.
  - link dẫn tới một mục menu khác của cùng gói; mục dành cho vai trò khác thì đường dẫn không hiện.
limits:
  - Chỉ đọc; không lọc, không chọn kỳ, không tải xuống.
  - Với nguồn graphql, không cộng, đếm hay tính trên trình duyệt và không dùng truy vấn _aggregate của Hasura; mọi con số phải là một cột do gói tính sẵn, thường là view trong migration của gói. Chỉ việc đang chờ chính người xem (workflow counts mine) được đếm trên trình duyệt.
  - Chỉ có biểu đồ cột ngang; không có biểu đồ đường, tròn hay chuỗi thời gian.
  - Nguồn workflow chỉ đếm hồ sơ của đơn vị người xem; tenant cha chưa xem được số hồ sơ của tenant con. Bước chỉ có ở phiên bản BPMN cũ không có dòng theo bước, và hồ sơ đang ở bước chờ (hẹn giờ) không thuộc bước nào.
  - Nguồn context chỉ hiện số đo mới nhất, không có lịch sử; tối đa context.limit thiết bị (mặc định 50, trần 200).
  - Biểu đồ hiện tối đa graphql.limit dòng (mặc định 50, trần 200); nhiều hơn thì chỉ hiện các dòng đầu và báo ra.
  - where.equals luôn gửi dạng chữ và make check-fast không kiểm nó với kiểu của cột (tệp quyền Hasura không ghi kiểu, cột của view không khai kiểu trong migration); giá trị không hợp kiểu chỉ lộ ra khi mở trang, thành lời báo nêu cột và dẫn tới người quản trị. Nên chỉ lọc theo cột kiểu chữ.
  - Cấu hình không cấp và không giới hạn quyền; người xem thấy số nào do quyền Hasura của bảng và vai trò quyết định.
