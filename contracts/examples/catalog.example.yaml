#
# Ví dụ cấu hình danh mục hợp lệ theo contracts/catalog.schema.json; `make check-fast` kiểm tệp này.
# Đây là tệp catalog/items.yaml mà mục menu `items` trong app.example.yaml trỏ tới. Đối tượng con
# khai lồng trong đối tượng cha: mỗi danh mục có các thành phần, mỗi thành phần có các lần kiểm. Nút trên màn hình
# chi tiết mở quy trình approval của gói (bpmn/approval.bpmn20.xml trong app.example.yaml) cho dòng đang xem.
# Gói thật đặt tệp trong thư mục của gói.

title: Danh mục
source: app_example_items
key: id
fields:
  - name: code
    label: Mã
  - name: name
    label: Tên
  - name: status
    label: Tình trạng
    choices:
      - value: active
        label: Đang dùng
      - value: retired
        label: Ngừng dùng
  - name: quantity
    label: Số lượng
    type: number
  - name: created_at
    label: Ngày tạo
    type: datetime
  # Cột của bảng khác, đọc qua quan hệ một-một `category` mà Hasura khai cho bảng: chỉ hiện ở màn hình chi tiết.
  - name: category.name
    label: Nhóm
list:
  columns: [code, name, status, quantity]
  search: [code, name]
  filters: [status]
  sort:
    field: code
    direction: asc
  page_size: 20
detail:
  title: name
  actions:
    - id: request
      label: Đề nghị kiểm tra
      process: approval
      variables:
        itemId: id
        title: name
        quantity: quantity
  # Giấy tờ đính kèm của danh mục đang xem (contracts/documents.schema.json, ADR 0041).
  documents:
    title: Giấy tờ đính kèm
    source: app_example_item_documents
    via: item_id
    file: file_id
    upload: { note: note }
  children:
    - id: parts
      label: Thành phần
      via: item_id
      source: app_example_parts
      fields:
        - name: name
          label: Tên
        - name: installed_on
          label: Ngày lắp
          type: date
      list:
        columns: [name, installed_on]
      detail:
        children:
          - id: checks
            label: Lần kiểm
            via: part_id
            source: app_example_checks
            key: check_no
            fields:
              - name: check_no
                label: Số phiếu
                type: number
              - name: result
                label: Kết quả
            list:
              columns: [check_no, result]
