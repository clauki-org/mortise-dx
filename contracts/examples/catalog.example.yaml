#
# Ví dụ cấu hình danh mục hợp lệ theo contracts/catalog.schema.json; `make check-fast` kiểm tệp này.
# Đây là tệp catalog/items.yaml mà mục menu `items` trong app.example.yaml trỏ tới. Đối tượng con
# khai lồng trong đối tượng cha: mỗi danh mục có các thành phần, mỗi thành phần có các lần kiểm. Nút trên màn hình
# chi tiết mở quy trình approval của gói (bpmn/approval.bpmn20.xml trong app.example.yaml) cho dòng đang xem. Nút
# "Sửa" và "Thêm thành phần" mở biểu mẫu theo contracts/form.schema.json khai ngay trong tệp (ADR 0054). Kiểu Kanban và
# Lịch của danh sách ở mục kanban, calendar (ADR 0066).
# Gói thật đặt tệp trong thư mục của gói.

title: Danh mục
source: app_example_items
key: id
fields:
  - name: code
    label: Mã
  - name: name
    label: Tên
  # tone chọn nghĩa màu của nhãn trong bộ nghĩa chung (ADR 0050); lựa chọn không khai tone hiện chữ thường.
  - name: status
    label: Tình trạng
    choices:
      - value: active
        label: Đang dùng
        tone: ok
      - value: retired
        label: Ngừng dùng
        tone: neutral
  - name: quantity
    label: Số lượng
    type: number
  - name: created_at
    label: Ngày tạo
    type: datetime
  # Cột của bảng khác, đọc qua quan hệ một-một `category` mà Hasura khai cho bảng: chỉ hiện ở màn hình chi tiết.
  - name: category.name
    label: Nhóm
list:
  columns: [code, name, status, quantity]
  search: [code, name]
  filters: [status]
  sort:
    field: code
    direction: asc
  page_size: 20
# Kiểu Kanban và Lịch (ADR 0066), chọn bằng variant hay nút "Kiểu hiển thị". Mỗi lựa chọn của status là một cột; move
# cho chuyển thẻ, ghi status kèm điều kiện updated_at như biểu mẫu sửa. Giá trị chỉ quy trình được đặt thì khai locked.
kanban:
  field: status
  move: { role: user, version: updated_at }
calendar:
  field: created_at
  title: name
detail:
  title: name
  actions:
    - id: request
      label: Đề nghị kiểm tra
      process: approval
      variables:
        itemId: id
        title: name
        quantity: quantity
  # Sửa dòng đang xem: chỉ gửi cột đã đổi, kèm điều kiện updated_at bằng giá trị đọc lúc mở.
  edit:
    label: Sửa
    form:
      title: Sửa danh mục
      role: user
      fields:
        - { name: code, label: Mã, type: string, required: true, max_length: 50 }
        - { name: name, label: Tên, type: string, required: true, max_length: 200 }
        - name: status
          label: Tình trạng
          type: choice
          choices:
            - { value: active, label: Đang dùng }
            - { value: retired, label: Ngừng dùng }
      submit: { label: Lưu, update: app_example_items, version: updated_at }
      done: { message: Đã lưu. }
  # Giấy tờ đính kèm của danh mục đang xem (contracts/documents.schema.json, ADR 0041).
  documents:
    title: Giấy tờ đính kèm
    source: app_example_item_documents
    via: item_id
    file: file_id
    upload: { note: note }
  children:
    - id: parts
      label: Thành phần
      via: item_id
      source: app_example_parts
      fields:
        - name: name
          label: Tên
        - name: installed_on
          label: Ngày lắp
          type: date
      list:
        columns: [name, installed_on]
      # item_id nhận khóa của dòng cha; ô chỉ đọc hiện mã của dòng cha.
      add:
        label: Thêm thành phần
        parent: code
        form:
          title: Thêm thành phần
          role: user
          fields:
            - { name: name, label: Tên, type: string, required: true }
            - { name: installed_on, label: Ngày lắp, type: date }
          submit: { label: Thêm, insert: app_example_parts }
          done: { message: Đã thêm thành phần. }
      # Nạp nhiều thành phần từ tệp (ADR 0064): tiêu đề cột là nhãn của trường; tên không được trùng trong tệp hay với
      # thành phần đã có của dòng cha.
      import:
        label: Nạp từ tệp
        max_rows: 200
        unique: name
        form:
          title: Nạp thành phần từ tệp
          fields:
            - { name: name, label: Tên, type: string, required: true }
            - { name: installed_on, label: Ngày lắp, type: date }
          submit: { label: Nạp, insert: app_example_parts }
          done: { message: Đã nạp thành phần. }
      detail:
        children:
          - id: checks
            label: Lần kiểm
            via: part_id
            source: app_example_checks
            key: check_no
            fields:
              - name: check_no
                label: Số phiếu
                type: number
              - name: result
                label: Kết quả
            list:
              columns: [check_no, result]
