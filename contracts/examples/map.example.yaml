# Ví dụ cấu hình bản đồ hợp lệ theo contracts/map.schema.json; `make check-fast` kiểm tệp này. Lớp đầu tô điểm theo
# một giá trị đọc qua quan hệ (group.score) theo ba bậc; lớp sau một màu, chỉ truy vấn khi token có vai trò
# rollup_reader. Hai vùng cố định tô dưới điểm, kèm một dòng ghi chú. Gói thật đặt tệp trong thư mục của gói
# (map-layers/).

title: Bản đồ
note: Ranh giới chỉ để minh họa.
areas:
  label: Khu vực
  color: indigo
  items:
    - name: Khu 1
      outline: [[105.80, 21.00], [105.82, 21.00], [105.82, 21.02], [105.80, 21.02]]
    - name: Khu 2
      outline: [[105.82, 21.00], [105.84, 21.00], [105.83, 21.02]]
layers:
  - id: sites
    label: Điểm đang dùng
    source: app_example_sites
    latitude: lat
    longitude: lon
    title: name
    where: { field: status, equals: active }
    # Tên điểm dẫn tới chi tiết dòng của mục danh mục `items` (ADR 0068), khóa ở cột item_id.
    record: { item: items, column: item_id }
    fields:
      - { name: code, label: Mã }
      - { name: group.score, label: Điểm của nhóm, type: number }
    color:
      by: group.score
      label: Điểm của nhóm
      steps:
        - { color: teal, label: Thấp }
        - { above: 10, color: orange, label: Vừa }
        - { above: 20, color: red, label: Cao }
    limit: 100
  - id: summary
    label: Tổng hợp của đơn vị con
    source: app_example_rollup
    role: rollup_reader
    latitude: lat
    longitude: lon
    title: name
    color: { fixed: gray }
