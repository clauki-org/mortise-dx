#
# Ví dụ app.yaml hợp lệ theo contracts/app.schema.json; `make check-fast` kiểm tệp này.
# Gói thật nằm ở apps/<id>/app.yaml. Mục `overview` là trang gồm khối (examples/page.example.yaml, ADR 0061); khối
# `sites` chỉ đặt trên trang đó, không lên menu.

id: example
name: Gói ví dụ
version: 0.1.0
description: Một danh mục đối tượng, một báo cáo và một quy trình duyệt.
# Gói phải cài trước và phải đang bật thì gói này mới bật được (ADR 0065).
requires:
  - example-base
database:
  schema: app_example
  migrations: schema/migrations
hasura: hasura
knowledge:
  - knowledge/example-rules.yaml
workflows:
  - bpmn/approval.bpmn20.xml
authorities:
  - authorities/approval.yaml
settings:
  approval_limit: 1000
  answer_within: P5D
menu:
  - id: items
    label: Danh mục
    component: catalog
    config: catalog/items.yaml
    icon: list
  - id: reports
    label: Báo cáo
    component: dashboard
    config: dashboards/summary.yaml
    icon: chart
    roles: [manager]
  - id: ask
    label: Hỏi văn bản
    component: assistant
    config: assistant/ask.yaml
    icon: chat
  - id: overview
    label: Tổng quan
    component: page
    config: pages/overview.yaml
    icon: home
blocks:
  - id: sites
    label: Địa điểm
    component: map
    config: map-layers/sites.yaml
