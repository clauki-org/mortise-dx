#
# Ví dụ app.yaml hợp lệ theo contracts/app.schema.json; `make check-fast` kiểm tệp này.
# Gói thật nằm ở apps/<id>/app.yaml.

id: example
name: Gói ví dụ
version: 0.1.0
description: Một danh mục đối tượng, một báo cáo và một quy trình duyệt.
database:
  schema: app_example
  migrations: schema/migrations
hasura: hasura
knowledge:
  - knowledge/example-rules.yaml
workflows:
  - bpmn/approval.bpmn20.xml
settings:
  approval_limit: 1000
  answer_within: P5D
menu:
  - id: items
    label: Danh mục
    component: catalog
    config: catalog/items.yaml
  - id: reports
    label: Báo cáo
    component: dashboard
    config: dashboards/summary.yaml
    roles: [manager]
  - id: ask
    label: Hỏi văn bản
    component: assistant
    config: assistant/ask.yaml
