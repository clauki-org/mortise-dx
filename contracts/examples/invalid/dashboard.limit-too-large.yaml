title: Tổng quan
panels:
  - id: children
    title: Đơn vị con
    description: View tổng hợp của đơn vị con.
    graphql: { field: app_example_rollup, limit: 201 }
    chart:
      type: bar
      x: { column: unit_name, label: Đơn vị }
      y: [{ column: score, label: Điểm, color: teal }]
