# Ví dụ SAI, phải bị contracts/dashboard.schema.json từ chối: một khối vừa thẻ số vừa biểu đồ. Thẻ số cần đúng một
# dòng còn biểu đồ cần nhiều dòng, nên một nguồn không phục vụ được cả hai.

title: Tổng quan
panels:
  - id: totals
    title: Tổng
    description: View tổng của đơn vị.
    graphql: { field: app_example_totals }
    cards: [{ column: score, label: Điểm, description: Tổng điểm. }]
    chart:
      type: bar
      x: { column: unit_name, label: Đơn vị }
      y: [{ column: score, label: Điểm, color: teal }]
