# Ví dụ cấu hình trợ lý hỏi văn bản hợp lệ theo contracts/assistant.schema.json; `make check-fast` kiểm tệp này,
# `make seed` dùng nó cho mục menu mẫu của lõi (/apps/core/ask-example). `documents` trỏ tới hai văn bản hư cấu ở
# contracts/examples/knowledge.example.yaml và knowledge-amendment.example.yaml; văn bản sau sửa một khoản của văn
# bản trước, nên phải hỏi cả hai.

intro: Hỏi về quy chế mẫu đặt phòng họp (hư cấu); câu trả lời kèm câu trích nguyên văn, thiếu căn cứ thì trợ lý từ chối.
examples:
  - Phòng họp được đặt trước tối đa bao nhiêu ngày?
  - Mỗi lần đặt phòng họp được dùng bao lâu?
documents: [example-rules, example-rules-amendment]
