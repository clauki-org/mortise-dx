#
# Ví dụ cấu hình bảng điều hành hợp lệ theo contracts/dashboard.schema.json; `make check-fast` kiểm tệp này với
# schema và với một bảng quyền mẫu (scripts/check-dashboard-config.py). Khối đầu là thẻ số trên một view mỗi đơn vị
# một dòng, là khối chính hiện đầu trang với số lớn; khối sau là biểu đồ của đơn vị con, chỉ truy vấn khi token có
# vai trò rollup_reader. description là lời của người xem; tên view, cột nằm ở method, chỉ hiện trong mục "Xem cách
# tính" (ADR 0045). Gói thật đặt tệp trong thư mục của gói (dashboards/).

title: Tổng quan
description: Số liệu của cả đơn vị.
panels:
  - id: totals
    title: Tổng của đơn vị
    description: Số đối tượng và tổng điểm của cả đơn vị.
    method: View app_example_totals, mỗi đơn vị một dòng, tính trong migration của gói.
    primary: true
    graphql: { field: app_example_totals }
    cards:
      - { column: item_count, label: Số đối tượng, format: integer, description: Đếm mọi dòng của bảng đối tượng. }
      - { column: score, label: Điểm, unit: điểm, description: Tổng điểm của các đối tượng đang dùng. }
    link: { menu: items, label: Xem danh mục đối tượng }
  - id: children
    title: Các đơn vị con
    description: Điểm và chỉ tiêu của từng đơn vị con, đúng bằng số mỗi đơn vị thấy trên trang của mình.
    method: View app_example_rollup, mỗi đơn vị con một dòng, lấy nguyên số của app_example_totals.
    size: full
    role: rollup_reader
    graphql: { field: app_example_rollup, order_by: [{ column: score, direction: desc }], limit: 20 }
    chart:
      type: bar
      x: { column: unit_name, label: Đơn vị }
      y:
        - { column: score, label: Điểm, color: teal }
        - { column: target, label: Chỉ tiêu, color: gray }
      details:
        - { column: basis, label: Căn cứ }
