# Mã của thành phần ở platform/web/src/ (MapPanel.tsx, MapCanvas.tsx, mapConfig.ts). Mỗi dòng dưới đây đã được chạy
# thử trên giao diện, trừ hai dòng về chi tiết dòng (ADR 0068, chưa chạy trên trình duyệt); đổi hành vi của thành phần thì sửa tệp này trong cùng pull request.

component: map
summary: Các lớp điểm đọc qua GraphQL theo cấu hình của gói, đặt lên nền bản đồ của bản cài (hay nền trơn khi chưa có) và tô màu theo một giá trị, kèm chú giải và danh sách điểm.
config_schema: map.schema.json
example: examples/map.example.yaml
capabilities:
  - Kiểu trình bày chọn bằng variant (ADR 0061), map (mặc định) có khung bản đồ; list chỉ có chú giải và danh sách điểm, không nạp MapLibre.
  - Mỗi lớp đọc một bảng hay view; mỗi dòng có tọa độ (latitude, longitude, WGS 84) thành một điểm mang tên lấy từ title.
  - Lọc dòng của lớp theo một cột bằng một giá trị (where).
  - Tô màu cả lớp một màu (color.fixed), hoặc theo giá trị số của một cột qua các bậc tăng dần (color.by, color.steps); dòng chưa có giá trị hiện màu xám.
  - Cột ở fields, title, tọa độ và color.by đi được qua quan hệ của Hasura bằng dấu chấm, ví dụ summary.excess_m2.
  - Lớp khai role chỉ được truy vấn khi token của người xem có vai trò đó, và truy vấn gửi kèm header X-Hasura-Role; lớp khác dùng vai trò mặc định.
  - Mỗi điểm là một nút đọc được bằng trình đọc màn hình (tên và nhãn màu); bấm một điểm thì dòng của nó được tô trong danh sách.
  - Chú giải màu và danh sách điểm của từng lớp với các trường trong fields; số dòng chưa có tọa độ được báo riêng.
  - Vùng cố định của cấu hình (areas), ví dụ ranh giới đơn vị, tô nhạt một màu, viền đậm hơn, tên vùng đặt ở trọng tâm diện tích; chú giải dưới bản đồ liệt kê tên mọi vùng.
  - Dòng ghi chú của cấu hình (note) luôn hiện ngay dưới bản đồ.
  - Khung bản đồ tự căn để thấy mọi điểm và trọn các vùng chứa ít nhất một điểm, chưa có điểm thì thấy mọi vùng; kéo, phóng to, thu nhỏ được bằng chuột và bằng nút "Phóng to", "Thu nhỏ".
  - Trình duyệt không vẽ được bản đồ (thiếu WebGL) thì báo lý do, danh sách điểm vẫn hiện.
  - Nền là tệp PMTiles mà `make basemap` cắt từ OpenStreetMap, đọc cùng origin ở /basemap/ (ADR 0056); kiểu vẽ có đường, sông, mặt nước, đất sử dụng, khu dân cư, không có khối nhà, ranh giới hành chính hay điểm quan tâm.
  - Mặc định không có chữ nào trên nền; bản cài chạy `make basemap LABELS=on` thì hiện tên địa danh, tên đường.
  - Có nền thì góc bản đồ luôn ghi "© OpenStreetMap (ODbL)", kể cả ở màn hình hẹp; không thu nhỏ được dưới mức phóng thấp nhất của tệp nền.
  - Bản cài chưa có nền, hay tệp nền hỏng, thì vẽ nền trơn một màu lấy từ theme.
  - Lớp khai record thì tên điểm trong danh sách điểm và dòng "Điểm đang chọn" dưới khung bản đồ là liên kết tới chi
    tiết dòng của mục danh mục record.item, khóa ở cột record.column (ADR 0068). Bấm chấm trên khung chỉ chọn điểm.
  - Đặt trong chi tiết một dòng của danh mục với attach (ADR 0068) thì lớp đọc bảng attach.source chỉ đọc điểm có
    attach.column bằng khóa của dòng đang xem, cộng vào where của lớp; lớp đọc bảng khác chạy như đứng riêng.
limits:
  - Chỉ đọc; không thêm, sửa hay di chuyển điểm.
  - Nền chỉ có vùng mà bản cài đã cắt; ngoài vùng đó là nền trống. Cấu hình của gói không chọn hay đổi nền.
  - Có nền thì khung chỉ căn theo các điểm nằm trong vùng đã cắt; điểm ở ngoài vẫn có trong danh sách nhưng có thể nằm ngoài khung. Không thu nhỏ được dưới mức phóng thấp nhất của nền, nên màn hình hẹp có thể không thấy hết mọi điểm và vùng cùng lúc.
  - Vùng lấy từ cấu hình, như nhau với mọi người xem; không đọc vùng từ CSDL, không vẽ đường hay cụm điểm.
  - Mỗi vùng là một đa giác đơn, không có lỗ, tối đa 500 đỉnh; tối đa 50 vùng. Tên vùng là chữ HTML, không tránh chồng lên nhau hay lên điểm.
  - Mỗi lớp tối đa limit dòng (mặc định 200, trần 1000); lớp nhiều dòng hơn chỉ hiện các dòng đầu theo thứ tự tên (title) rồi các cột còn lại, và báo ra.
  - Lọc chỉ theo một cột bằng một giá trị; không có ô lọc hay tìm cho người xem.
  - Kiểu của trường chỉ có text và number; number, dù đến dạng số hay chuỗi thập phân, luôn viết có dấu ngăn hàng nghìn và tối đa ba chữ số thập phân.
  - Cấu hình không cấp và không giới hạn quyền; người xem thấy dòng nào do quyền Hasura của bảng và vai trò quyết định.
