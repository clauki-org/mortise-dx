#
# Bản mô tả thành phần danh mục theo contracts/component.schema.json; `make check-fast` kiểm tệp này.
# Mã của thành phần ở platform/web/src/ (Catalog.tsx, CatalogRecord.tsx, CatalogTable.tsx, CatalogRows.tsx,
# CatalogActions.tsx, catalog.ts, catalogQuery.ts; phần tài liệu ở CatalogDocuments.tsx; nút sửa và thêm dòng con ở
# CatalogForm.tsx; Kanban, Lịch ở CatalogKanban.tsx, CatalogCalendar.tsx, catalogViews.ts; nút nạp từ tệp ở
# CatalogImport.tsx, CatalogImportPreview.tsx, catalogImport.ts, catalogImportFile.ts, catalogImportTemplate.ts; khối
# trong chi tiết ở RecordBlocks.tsx). Mỗi dòng dưới đây đã được chạy thử trên giao diện, trừ nút sửa và thêm dòng con
# (ADR 0054, mục Chưa kiểm), Kanban, Lịch (ADR 0066, mục Chưa kiểm), nút nạp từ tệp (ADR 0064, mục Chưa kiểm) và khối
# trong chi tiết (ADR 0068, chưa chạy trên trình duyệt); đổi hành vi của thành phần thì sửa tệp này trong cùng pull
# request.

component: catalog
summary: Danh sách và màn hình chi tiết của một loại đối tượng cùng các đối tượng con của nó, đọc qua GraphQL theo cấu hình của gói.
config_schema: catalog.schema.json
example: examples/catalog.example.yaml
capabilities:
  - Kiểu trình bày của danh sách ngoài cùng chọn bằng variant (table, cards, kanban, calendar; ADR 0061, ADR 0066); người xem vẫn đổi được bằng nút chọn kiểu. Đặt trong một khối của trang (component page) thì chỉ có danh sách, giữ tìm, lọc, trang trong bộ nhớ, không có nút xuất.
  - Danh sách dạng bảng; cột nào hiện, tên cột và thứ tự cột theo fields và list.columns.
  - Danh sách ngoài cùng có công tắc Bảng/Thẻ (mặc định Bảng, ADR 0050). Ở dạng thẻ mỗi dòng một thẻ, giá trị cột đầu là
    liên kết tới màn hình chi tiết như ở bảng, các cột sau là cặp nhãn, giá trị; ô "Sắp theo" chọn cột và chiều. Tìm,
    lọc, phân trang như dạng bảng; dạng thẻ nằm trên đường dẫn. Bảng đối tượng con luôn ở dạng bảng.
  - Kiểu Kanban (mục kanban, ADR 0066) có một cột cho mỗi lựa chọn của kanban.field, theo thứ tự choices, cột có tone
    mang nhãn màu; dòng có giá trị trống hay ngoài choices vào cột "Chưa xếp cột", cột này chỉ hiện khi có dòng. Mỗi cột đọc
    riêng tối đa list.page_size thẻ theo cùng tìm, lọc, thứ tự; còn thẻ thì cột báo. Khai kanban.move thì người có vai
    trò move.role chuyển thẻ bằng kéo thả hay nút "Chuyển sang" trên thẻ (bàn phím, điện thoại); lệnh ghi đúng cột
    kanban.field qua update của Hasura với điều kiện cột move.version, không khớp thì báo và tải lại bảng. Cột trong
    kanban.locked không nhận và không cho chuyển thẻ đi; không khai move thì bảng chỉ đọc.
  - Kiểu Lịch (mục calendar, ADR 0066) đặt mỗi dòng ở ngày của calendar.field (cột date theo ngày lưu, cột datetime
    theo giờ của trình duyệt), xem theo tháng (lưới bảy cột từ thứ hai) hay tuần (danh sách bảy ngày), nút tháng, tuần trước,
    sau và hôm nay; chữ của dòng là calendar.title, là liên kết tới chi tiết. Dòng có ngày không đọc được hiện ở danh
    sách riêng. Tìm, lọc như danh sách.
  - Tìm theo chữ, không phân biệt hoa thường, trên các trường kiểu text khai trong list.search.
  - Lọc theo một giá trị của mỗi trường có choices khai trong list.filters.
  - Sắp xếp tăng hoặc giảm theo một cột khi bấm tiêu đề cột; thứ tự lúc mới mở theo list.sort. Dòng chưa có giá
    trị ở cột sắp xếp đứng cuối.
  - Phân trang theo list.page_size, có nút trang trước và trang sau.
  - Tìm, lọc, thứ tự và trang của danh sách nằm trên đường dẫn; mở lại đường dẫn là về đúng chỗ đang xem.
  - Màn hình chi tiết của một dòng hiện mọi trường trong fields theo thứ tự khai, mỗi trường một ô trong lưới (nhãn
    trên, giá trị dưới).
  - Giá trị hiện theo kiểu của trường (số, ngày, ngày giờ); trường có choices hiện chữ thay cho giá trị lưu; giá trị
    trống hiện một gạch mờ. Lựa chọn có tone hiện thành nhãn màu theo bộ nghĩa chung, luôn kèm chữ, ở bảng, thẻ và màn
    hình chi tiết (ADR 0050). Bảng rộng hơn màn hình cuộn ngang trong một vùng có nhãn, giữ mọi cột đã khai (ADR 0047).
  - Quan hệ cha–con nhiều cấp, khai lồng trong cùng tệp bằng detail.children. Màn hình chi tiết của cha có bảng của
    từng loại đối tượng con, tìm, lọc và phân trang được; màn hình chi tiết của con có đường về mọi cấp cha.
  - Màn hình chi tiết hiện được cột của bảng khác qua quan hệ một-một mà Hasura khai cho bảng, khai trong fields
    dạng <quan hệ>.<cột>.
  - Nút trên màn hình chi tiết (detail.actions, ở mọi cấp cha–con) khởi tạo một quy trình của gói cho dòng đang xem
    qua API quy trình, với biến lấy từ khóa hay trường của dòng (ADR 0026). Hộp xác nhận hiện các giá trị sẽ gửi;
    trường còn trống thì không cho gửi. Bấm đúp hay gửi lại sau lỗi trong cùng hộp chỉ tạo một quy trình
    (Idempotency-Key).
  - Nút "Xuất" trên màn hình danh sách tải về tệp CSV, Excel (.xlsx) hay PDF gồm mọi dòng khớp tìm, lọc và thứ tự
    đang xem, đọc trong một truy vấn bằng quyền của người xuất; đầu tệp ghi tên danh sách, nguồn, đơn vị, thời điểm
    và múi giờ, người xuất, điều kiện và số dòng. CSV chặn công thức ở ô bắt đầu bằng = + - @, tab hay CR; Excel ghi
    ô chữ là chữ (ADR 0052).
  - Nút sửa dòng đang xem (detail.edit, ở mọi cấp cha–con) mở biểu mẫu có submit.update trong hộp thoại, điền sẵn giá
    trị đọc lại từ máy chủ lúc mở bằng vai trò của biểu mẫu; nút thêm dòng con (add của đối tượng con) đứng cạnh
    tiêu đề bảng con, mở biểu mẫu có submit.insert với cột via mang khóa của dòng cha, hiện một ô chỉ đọc mang giá trị
    của dòng cha (add.parent, bỏ trống là tiêu đề). Biểu mẫu theo contracts/form.schema.json, khai ngay trong cấu
    hình danh mục. Nút chỉ hiện khi token có vai trò form.role (bỏ trống là user). Lưu được thì hộp đóng, hiện
    done.message và đọc lại dòng hay bảng con (ADR 0054).
  - Nút nạp từ tệp (import của đối tượng con) đứng cạnh nút thêm dòng con, mở hộp thoại để tải tệp mẫu .xlsx sinh từ
    các trường của biểu mẫu (trang dữ liệu chỉ có dòng tiêu đề, trang hướng dẫn ghi kiểu, giới hạn, giá trị được nhận
    của từng cột); chọn tệp .xlsx hay CSV UTF-8 (có hoặc không BOM, dấu phẩy hay chấm phẩy). Tiêu đề cột khớp theo
    nhãn hay tên trường; ô số, ô ngày của Excel đọc theo kiểu Excel, số gõ dạng chữ nhận dấu phẩy thập phân, ngày gõ
    dạng ngày/tháng/năm, lựa chọn nhận nhãn hay giá trị. Mỗi dòng kiểm như biểu mẫu nhập tay; trường unique kiểm trùng
    trong tệp và với dòng con đã có của dòng cha. Xem trước ghi lỗi bằng chữ theo dòng (số dòng của bảng tính) và cột.
    Không còn lỗi thì mọi dòng gửi trong một lệnh thêm bằng vai trò của biểu mẫu, cột via mang khóa của dòng cha;
    Hasura chạy lệnh trong một giao dịch nên lỗi ở một dòng thì không dòng nào được thêm (ADR 0064).
  - Phần tài liệu đính kèm của dòng đang xem (detail.documents, ở mọi cấp cha–con) để xem, tải xuống, đính kèm tệp;
    năng lực và giới hạn ở contracts/documents.component.yaml (ADR 0041).
  - Khối trong màn hình chi tiết (detail.blocks, ở mọi cấp cha–con; ADR 0068) là mục menu hay khối của chính gói, vẽ như
    trên trang, nằm dưới các trường. Có attach thì khối chỉ đọc dòng của attach.source có attach.column bằng khóa của
    dòng đang xem; không có thì khối chạy như đứng riêng. Danh mục đặt làm khối như vậy cũng lọc danh sách của nó theo
    dòng đang xem. Liên kết của dòng dựng bằng liên kết chung tới chi tiết dòng (menu.ts).
  - Nơi gọi đưa cấu hình, địa chỉ gốc, gói và mục; ngoài menu của gói (để tìm mục của detail.blocks), thành phần không
    cần bảng hay cấu hình nào khác của hệ thống.
limits:
  - Không xóa dòng. Chỉ sửa dòng đang xem và thêm dòng con của dòng đang xem; danh sách ngoài cùng không có nút thêm
    dòng. Việc ghi khác là khởi tạo quy trình bằng nút gói khai và đính kèm tệp ở phần tài liệu.
  - Nạp từ tệp chỉ thêm dòng mới, không sửa dòng đã có; tối đa max_rows dòng (trần 1.000) và 5 MB mỗi tệp; chỉ trang
    đầu của tệp .xlsx được đọc; không nhận .xls, trường chọn từ bảng (source) hay kiểu boolean. Tệp .xlsx có phần nén
    giải ra từ 512 KB bị từ chối, vì thư viện giải nén phần đó trong Web Worker mà CSP của giao diện chặn.
  - Nút sửa, nút thêm hiện cho mọi token có vai trò của biểu mẫu, kể cả người mà quyền theo dòng của Hasura không cho
    ghi dòng đó; lần lưu của họ không khớp dòng nào hay bị từ chối, và được báo bằng lời.
  - Mỗi danh sách đọc một bảng; không hiện cột của bảng khác, kể cả tên của đối tượng cha. Cột qua quan hệ chỉ hiện ở
    màn hình chi tiết, chỉ một cấp, không tìm, lọc hay sắp xếp được.
  - Nút chỉ mở quy trình của cùng gói, chỉ khởi tạo; không hiện trạng thái hồ sơ đã lập và không chặn hai hồ sơ cùng
    mở cho một dòng. Nút hiện cho mọi người đọc được dòng; ai được khởi tạo do workflow-api quyết định.
  - Giá trị gửi cho quy trình do trình duyệt đọc từ dòng lúc bấm; quy trình không tự đọc lại từ CSDL.
  - Không hiện tổng số dòng và tổng số trang.
  - Kanban và Lịch chỉ ở danh sách ngoài cùng. Kanban không phân trang, mỗi cột tối đa list.page_size thẻ. Lịch đọc tối
    đa 200 dòng của khoảng đang xem, chỉ đọc (không kéo đổi ngày), không có sự kiện nhiều ngày; tháng, tuần đang xem không
    nằm trên đường dẫn. Chuyển thẻ không qua quy trình; trường do quy trình đặt thì gói không khai move hay khai locked.
  - Xuất chỉ ở danh sách ngoài cùng, tối đa 5.000 dòng một tệp; bảng đối tượng con không xuất. Lần xuất không được
    ghi nhật ký phía máy chủ.
  - Mỗi lúc chỉ sắp xếp theo một cột; thứ tự của chữ có dấu là thứ tự so sánh của CSDL.
  - Màu của nhãn chỉ chọn được trong bộ nghĩa chung bad, warn, info, ok, neutral, theo từng lựa chọn của choices; trường
    không có choices không thành nhãn. Thẻ không có ảnh, biểu tượng hay mô tả riêng của gói.
  - Ô tìm không dò trường số, trường ngày và trường có choices.
  - Không có kiểu đúng/sai riêng; cột đúng/sai hiện và lọc được khi khai choices với giá trị "true" và "false".
  - Đối tượng con trỏ về cha bằng một cột; không hỗ trợ khóa ghép. Đối tượng con chỉ mở được từ đối tượng cha.
  - Kiểu number luôn viết có dấu ngăn hàng nghìn; số không phải số lượng (số cổng, năm, mã) nên khai là text.
  - Cấu hình không cấp và không giới hạn quyền; người dùng thấy dòng nào do quyền Hasura của bảng quyết định.
