# Bản mô tả thành phần trợ lý hỏi văn bản theo contracts/component.schema.json; `make check-fast` kiểm tệp này.
# Mã của thành phần ở platform/web/src/ (Assistant.tsx, assistant.ts); dịch vụ phía sau ở platform/services/assistant
# (ADR 0021). Đổi hành vi của thành phần thì sửa tệp này trong cùng pull request.

component: assistant
summary: Khung hỏi đáp trên các văn bản gói khai ở `knowledge`, trả lời kèm câu trích nguyên văn hay từ chối có lý do.
config_schema: assistant.schema.json
example: examples/assistant.example.yaml
capabilities:
  - Ô hỏi và lời giới thiệu theo intro; câu hỏi mẫu trong examples hiện thành nút, bấm là hỏi ngay.
  - Chỉ hỏi trong các văn bản liệt kê ở documents, thuộc gói của mục menu.
  - Câu trả lời hiện kèm từng câu làm căn cứ, đúng chữ lưu trong dữ liệu, cùng tên văn bản và nhãn vị trí.
  - Từ chối hiện lý do của dịch vụ, gồm không có đoạn đủ gần câu hỏi và câu trả lời không qua bước kiểm.
  - Mô hình chưa chạy, đang bận hay quá giờ thì hiện thông điệp của dịch vụ, gồm cách bật mô hình.
  - Cấu hình thiếu intro hay documents, hay quá giới hạn của hợp đồng (50 văn bản, mã văn bản 64 ký tự), thì báo lý
    do trên màn hình thay vì gửi câu hỏi.
limits:
  - Mỗi lần một câu hỏi; không giữ lịch sử hỏi đáp trên màn hình, không hỏi tiếp theo câu trước.
  - Chỉ hỏi văn bản của gói chứa mục menu (hay `core` cho mục mẫu của lõi); không hỏi văn bản của gói khác.
  - Không lọc văn bản theo vai trò; người hỏi thấy đoạn nào do quyền Hasura theo tenant quyết định.
