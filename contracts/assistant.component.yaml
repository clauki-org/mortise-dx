# Bản mô tả thành phần trợ lý theo contracts/component.schema.json; `make check-fast` kiểm tệp này. Mã của thành
# phần ở platform/web/src/ (Assistant.tsx hỏi văn bản, AssistantData.tsx hỏi dữ liệu, assistant.ts); dịch vụ phía sau
# ở platform/services/assistant (ADR 0021, ADR 0027). Đổi hành vi của thành phần thì sửa tệp này trong cùng pull
# request.

component: assistant
summary: >-
  Khung hỏi đáp của một mục menu, làm một trong hai việc: hỏi các văn bản gói khai ở `knowledge`, trả lời kèm câu
  trích nguyên văn; hay hỏi dữ liệu trên các bảng gói khai ở `data`, trả bảng kèm câu truy vấn đã chạy.
config_schema: assistant.schema.json
example: examples/assistant.example.yaml
capabilities:
  - Ô hỏi và lời giới thiệu theo intro; câu hỏi mẫu trong examples hiện thành nút, bấm là hỏi ngay.
  - Chỉ hỏi trong các văn bản liệt kê ở documents, thuộc gói của mục menu.
  - Câu trả lời hiện kèm từng câu làm căn cứ, đúng chữ lưu trong dữ liệu, cùng tên văn bản và nhãn vị trí.
  - Dưới câu trả lời ghi mô hình đã trả lời và nơi chạy, "chạy tại chỗ" hay "qua API <tên máy>", theo `model` của
    dịch vụ.
  - Từ chối hiện lý do của dịch vụ, gồm không có đoạn đủ gần câu hỏi và câu trả lời không qua bước kiểm.
  - Mô hình chưa chạy, đang bận hay quá giờ thì hiện thông điệp của dịch vụ, gồm cách bật mô hình.
  - Cấu hình thiếu intro hay documents, hay quá giới hạn của hợp đồng (50 văn bản, mã văn bản 64 ký tự), thì báo lý
    do trên màn hình thay vì gửi câu hỏi.
  - Với mục có `data`, câu mẫu trong data.examples hiện thành nút; bấm là chạy câu GraphQL viết sẵn, không cần
    mô hình. Dịch vụ đọc bảng, cột được phép từ chính mục menu bằng token người hỏi, cho câu qua guard rồi chạy đúng
    câu đó qua Hasura với vai trò user.
  - Với mục có `data`, ô hỏi nhận câu gõ tự do, mô hình viết một câu GraphQL chỉ đọc từ mô tả bảng, cột của mục, không
    thấy dòng dữ liệu nào; câu qua cùng guard, bị từ chối thì mô hình viết lại một lần (ADR 0034). Kết quả ghi câu
    truy vấn do mô hình nào viết, chạy tại chỗ hay qua API của máy nào, ghi khi mô hình đã viết lại, và nhắc đọc câu
    đã chạy. Lời từ chối là chữ cố định theo bước từ chối (mô hình, guard kèm lý do của guard, Hasura), không phải chữ
    của mô hình. Mô hình chưa chạy hay đang bận thì hiện thông điệp của dịch vụ.
  - Kết quả hỏi dữ liệu hiện thành bảng với tiêu đề cột của gói, mỗi ô là chữ thường; luôn kèm câu truy vấn đã chạy
    trong phần "Xem câu truy vấn" đóng sẵn (ADR 0047). Câu bị guard hay Hasura từ chối hiện lý do và câu bị từ chối,
    phần câu truy vấn mở sẵn; mô hình không viết câu nào thì không có khối
    câu truy vấn. Màn hình nói rõ dữ liệu chỉ trong phạm vi
    quyền của tài khoản đang hỏi.
limits:
  - Mỗi lần một câu hỏi; không giữ lịch sử hỏi đáp trên màn hình, không hỏi tiếp theo câu trước.
  - Chỉ hỏi văn bản của gói chứa mục menu (hay `core` cho mục mẫu của lõi); không hỏi văn bản của gói khác.
  - Không lọc văn bản theo vai trò; người hỏi thấy đoạn nào do quyền Hasura theo tenant quyết định.
  - Câu hỏi dữ liệu gõ tự do cần mô hình (Ollama hay API theo cấu hình); mô hình có thể viết câu qua guard mà vẫn hiểu
    sai câu hỏi, nên người hỏi đọc câu đã chạy. Mỗi câu tối đa hai lượt mô hình viết, trong một hạn chung.
  - Hỏi dữ liệu chỉ đọc bảng, cột của gói chứa mục menu, chỉ theo quan hệ một-một, tối đa max_rows dòng mỗi danh
    sách; không ghi, không introspection. Dòng nào hiện do quyền Hasura của vai trò user quyết định.
