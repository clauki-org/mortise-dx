# Bản mô tả thành phần biểu mẫu nhập liệu theo contracts/component.schema.json; `make check-fast` kiểm tệp này.
# Mã của thành phần ở platform/web/src/ (FormPanel.tsx, FormFields.tsx, SourceChoice.tsx, formConfig.ts, formInsert.ts,
# formUpdate.ts; hộp thoại mở từ danh mục ở CatalogForm.tsx); luật cấu hình theo gói ở scripts/check-form-config.py. Đổi hành vi của thành phần thì sửa tệp này trong cùng pull request.

component: form
summary: Biểu mẫu nhập liệu theo cấu hình của gói; gửi thì khởi tạo một quy trình của gói, thêm một dòng vào một bảng của gói, hoặc sửa một dòng mở từ danh mục, bằng token của người dùng.
config_schema: form.schema.json
example: examples/form.example.yaml
capabilities:
  - Trường kiểu string (max_length, multiline), number và integer (min, max), boolean, date và choice; required đánh dấu trường bắt buộc, với boolean là bắt buộc đánh dấu.
  - Trường choice chọn từ danh sách cố định (choices) hoặc từ một bảng của gói qua GraphQL (source), xếp theo nhãn, đọc lại từ máy chủ mỗi lần mở.
  - Danh sách source lọc được theo giá trị của một trường đứng trước (source.where); trường đó còn trống thì ô bị khóa, đổi trường đó thì giá trị đã chọn bị xóa.
  - Cùng ô chọn này vẽ trường khai ở sources của một bước quy trình (contracts/workflow.schema.json, màn hình xử lý
    việc TaskScreen.tsx) và chỉ hiện dòng có cột case bằng mã hồ sơ của việc, đọc bằng vai trò của nguồn, xếp theo cột order,
    danh sách trống thì hiện chữ empty của gói (ADR 0069).
  - Danh sách source dài hơn limit (mặc định 200, trần 500) thì chỉ hiện limit mục đầu và báo ra.
  - help của trường hiện thành một dòng gợi ý dưới nhãn, gắn vào ô nhập bằng aria-describedby, ở mọi kiểu trường (ADR 0050).
  - Các trường xếp một cột, rộng tối đa 640px.
  - Kiểm dữ liệu ở trình duyệt theo các luật trên, lỗi hiện cạnh từng ô bằng tiếng Việt; máy chủ vẫn là nơi quyết định.
  - submit.process khởi tạo quy trình của gói với biến là các trường đã điền (trường trống không gửi) kèm Idempotency-Key; bấm đúp hay gửi lại cùng dữ liệu chỉ tạo một hồ sơ, đổi dữ liệu rồi gửi là hồ sơ mới.
  - submit.insert thêm một dòng vào bảng của gói, tên trường là tên cột; tenant_id do quyền Hasura của gói đặt từ token, không gửi từ trình duyệt, và không cột nào gắn với tenant được làm trường; lỗi ràng buộc và quyền của Hasura được báo bằng tiếng Việt kèm cách sửa; thiếu cột bắt buộc mà biểu mẫu không có ô thì lời báo nêu tên cột và báo người quản trị thêm trường, vì người gửi không tự sửa được.
  - submit.update (chỉ trong detail.edit của danh mục, ADR 0054) sửa một dòng theo khóa của loại đối tượng; lúc mở đọc
    lại dòng bằng vai trò của biểu mẫu để điền sẵn, gửi chỉ cột đã đổi (ô bị xóa trắng thành null), với điều kiện cột
    submit.version bằng giá trị đọc lúc mở. Lệnh không khớp dòng nào thì báo "Dòng này đã có người sửa hoặc bạn không
    còn quyền sửa", đọc lại dòng và điền lại giá trị mới, không ghi đè. Không đổi gì thì không gửi.
  - Bảng đích của submit.insert, submit.update có trường tùy chỉnh do quản trị org định nghĩa (ADR 0059) thì biểu mẫu có
    thêm ô của chúng ở cuối, theo kiểu (chữ tối đa 2000 ký tự, số, ngày, lựa chọn) và bắt buộc; giá trị gửi trong cột
    custom. Lệnh sửa gộp giá trị đổi lên custom vừa đọc lại và chỉ gửi custom khi một ô tùy chỉnh đổi; lựa chọn đã lưu
    mà vừa bị bỏ khỏi danh sách vẫn chọn được. CSDL từ chối giá trị sai thì lời báo là lý do CSDL nêu.
  - Biểu mẫu thêm dòng con mở từ danh mục (add của đối tượng con) gửi thêm cột nối về cha với khóa của dòng cha; cột đó
    không là trường của biểu mẫu.
  - role (bỏ trống là user) gửi kèm header X-Hasura-Role với danh sách source, lệnh đọc lại dòng và lệnh thêm hay sửa dòng; token không có vai trò đó thì biểu mẫu không hiện mà báo lý do.
  - Gửi được thì hiện done.message, nút "Lập tiếp" và đường dẫn tới mục menu done.menu của cùng gói nếu người dùng thấy mục đó.
  - Nhãn, tiêu đề và hướng dẫn hiện dạng chữ, không dạng HTML; gói không truyền được tùy chọn vẽ nào của rjsf.
limits:
  - Mỗi lần gửi một dòng hoặc một hồ sơ; không xóa dòng, không có bảng con nhiều dòng. Sửa dòng chỉ mở được từ màn
    hình chi tiết của danh mục, không từ menu.
  - submit.update cần cột version do CSDL đặt ở mỗi lệnh UPDATE (trigger); bảng không có cột đó thì không sửa được bằng
    biểu mẫu. Lệnh không khớp dòng nào vì người khác đã sửa hay vì không còn quyền đều nhận cùng một lời báo.
  - Không tải tệp lên, không có trường chọn nhiều giá trị.
  - Ô của trường tùy chỉnh không có giới hạn số, độ dài riêng hay dòng gợi ý; luật kiểu và bắt buộc do CSDL kiểm lại.
  - Giá trị của danh sách source luôn gửi dạng chữ; thêm dòng vào cột kiểu Int của Hasura thì bị từ chối.
  - submit.insert không có Idempotency-Key; nút bị khóa khi đang gửi, nhưng gửi lại sau khi mất phản hồi có thể báo trùng mã dù dòng đã được thêm.
  - Ràng buộc NOT NULL và CHECK của bảng không được make check-fast kiểm; cột bắt buộc mà biểu mẫu không khai chỉ lộ ra khi gửi, thành lời báo nêu tên cột cho người quản trị.
  - Cấu hình không cấp và không giới hạn quyền; ai được khởi tạo, được thêm dòng do workflow-api và quyền Hasura quyết định.
