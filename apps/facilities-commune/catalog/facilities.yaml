#
# Cấu hình thành phần danh mục cho cơ sở → tòa → phòng, theo contracts/catalog.schema.json; app.yaml trỏ tới tệp
# này ở mục menu `facilities` và `make check-fast` kiểm. Tên bảng là tên GraphQL mà Hasura sinh từ
# hasura/tables.yaml (<lược đồ>_<bảng>); cột khai ở đây phải nằm trong quyền đọc của vai trò `user` ở tệp đó.
# Khóa của cơ sở và tòa là id vì bảng con nối về cha bằng uuid (facility_id, building_id). Nút "Lập hồ sơ rà soát"
# mở quy trình bpmn/facilities-review.bpmn20.xml cho cơ sở đang xem (ADR 0026).
# Nút "Sửa" và "Thêm tòa", "Thêm phòng" mở biểu mẫu khai ngay trong tệp này (ADR 0054), gửi bằng vai trò user: quyền
# insert, update của vai trò đó ở hasura/tables.yaml chỉ cho cán bộ phụ trách (custodian) của cơ sở ghi, nên người
# duyệt cũng thấy nút nhưng lệnh của họ không khớp dòng nào và được báo. updated_at do trigger của
# 20261127180000_row_updated_at.sql đặt; biểu mẫu sửa so cột này để không ghi đè lần sửa của người khác.

title: Cơ sở nhà, đất
source: app_facilities_commune_facilities
fields:
  - { name: code, label: Mã }
  - { name: name, label: Tên cơ sở }
  - { name: address, label: Địa chỉ }
  # Tọa độ khai kiểu text: kiểu number làm tròn còn ba chữ số thập phân, lệch tới khoảng 55 m.
  - { name: latitude, label: Vĩ độ }
  - { name: longitude, label: Kinh độ }
  # Dôi dư là cơ sở cần phương án xử lý khi sắp xếp, nên nhãn mang mức cần để ý; đang sử dụng là bình thường.
  - name: status
    label: Tình trạng
    choices:
      - { value: in_use, label: Đang sử dụng, tone: ok }
      - { value: surplus, label: Dôi dư, tone: warn }
  - { name: created_at, label: Ngày tạo, type: datetime }
  # Phần vượt tính trên tổng diện tích các trụ sở của cả xã (view area_summary, qua quan hệ summary ở
  # hasura/tables.yaml), không tính riêng từng cơ sở; hồ sơ rà soát của mọi cơ sở trong xã mang cùng số này.
  - { name: summary.excess_m2, label: Phần vượt tiêu chuẩn của xã (m²), type: number }
list:
  columns: [code, name, address, status]
  search: [code, name, address]
  filters: [status]
detail:
  title: name
  # Biến theo workflows/facilities-review.yaml: title hiện trên bảng việc, facilityId để mở lại cơ sở, excessM2 chọn
  # nhánh báo cáo hay công khai ngay khi lập.
  actions:
    - id: review
      label: Lập hồ sơ rà soát
      process: facilities-review
      variables:
        title: name
        facilityId: id
        excessM2: summary.excess_m2
  edit:
    label: Sửa
    form:
      title: Sửa cơ sở
      fields:
        - { name: code, label: Mã, type: string, required: true, max_length: 50 }
        - { name: name, label: Tên cơ sở, type: string, required: true, max_length: 200 }
        - { name: address, label: Địa chỉ, type: string, max_length: 500 }
        - name: status
          label: Tình trạng
          type: choice
          required: true
          choices:
            - { value: in_use, label: Đang sử dụng }
            - { value: surplus, label: Dôi dư }
        # Bảng buộc tọa độ có đủ cả hai hoặc trống cả hai (facilities_location_pair).
        - name: latitude
          label: Vĩ độ
          type: number
          min: -90
          max: 90
          help: Nhập cả vĩ độ và kinh độ, hoặc để trống cả hai.
        - { name: longitude, label: Kinh độ, type: number, min: -180, max: 180 }
      submit: { label: Lưu, update: app_facilities_commune_facilities, version: updated_at }
      done: { message: Đã lưu cơ sở. }
  # Giấy tờ đính kèm cơ sở (ADR 0041): bảng nối facility_documents ở hasura/tables.yaml. Ai thấy cơ sở thì thấy giấy
  # tờ của nó; nút đính kèm hiện cho mọi người thấy cơ sở, nhưng chỉ cán bộ phụ trách (custodian) gắn được tệp.
  documents:
    title: Giấy tờ đính kèm
    source: app_facilities_commune_facility_documents
    via: facility_id
    file: file_id
    fields:
      - { name: note, label: Ghi chú }
      - { name: created_at, label: Ngày đính kèm, type: datetime }
    sort: { field: created_at, direction: desc }
    upload:
      label: Đính kèm tệp
      note: note
  children:
    - id: buildings
      label: Tòa nhà
      via: facility_id
      source: app_facilities_commune_buildings
      fields:
        - { name: code, label: Mã }
        - { name: name, label: Tên tòa }
        - { name: floors, label: Số tầng, type: number }
        - { name: created_at, label: Ngày tạo, type: datetime }
      list:
        columns: [code, name, floors]
        search: [code, name]
      # Mã cơ sở hiện chỉ đọc; facility_id nhận khóa của cơ sở đang xem, không có ô để đổi.
      add:
        label: Thêm tòa
        parent: code
        form:
          title: Thêm tòa nhà
          fields: &building_fields
            - { name: code, label: Mã tòa, type: string, required: true, max_length: 50 }
            - { name: name, label: Tên tòa, type: string, required: true, max_length: 200 }
            - { name: floors, label: Số tầng, type: integer, min: 1, max: 100 }
          submit: { label: Thêm, insert: app_facilities_commune_buildings }
          done: { message: Đã thêm tòa nhà. }
      detail:
        title: name
        edit:
          label: Sửa
          form:
            title: Sửa tòa nhà
            fields: *building_fields
            submit: { label: Lưu, update: app_facilities_commune_buildings, version: updated_at }
            done: { message: Đã lưu tòa nhà. }
        children:
          - id: rooms
            label: Phòng
            via: building_id
            source: app_facilities_commune_rooms
            fields:
              - { name: code, label: Mã }
              - { name: name, label: Tên phòng }
              - { name: floor, label: Tầng, type: number }
              # Loại diện tích quyết định phòng được tính vào định mức nào, nên lọc được theo nó.
              - name: area_type
                label: Loại diện tích
                choices:
                  - { value: working, label: Làm việc }
                  - { value: shared, label: Sử dụng chung }
                  - { value: specialized, label: Chuyên dùng }
              - { name: clear_area_m2, label: Diện tích thông thủy (m²), type: number }
              - { name: created_at, label: Ngày tạo, type: datetime }
            list:
              columns: [code, name, floor, area_type, clear_area_m2]
              search: [code, name]
              filters: [area_type]
            add:
              label: Thêm phòng
              parent: code
              form:
                title: Thêm phòng
                fields: &room_fields
                  - { name: code, label: Mã phòng, type: string, required: true, max_length: 50 }
                  - { name: name, label: Tên phòng, type: string, required: true, max_length: 200 }
                  - { name: floor, label: Tầng, type: integer, min: -10, max: 100 }
                  - name: area_type
                    label: Loại diện tích
                    type: choice
                    required: true
                    choices:
                      - { value: working, label: Làm việc }
                      - { value: shared, label: Sử dụng chung }
                      - { value: specialized, label: Chuyên dùng }
                  - name: clear_area_m2
                    label: Diện tích thông thủy (m²)
                    type: number
                    required: true
                    min: 0.01
                    max: 99999999.99
                    help: Đo lọt lòng tường, đơn vị m², tối đa hai chữ số thập phân.
                submit: { label: Thêm, insert: app_facilities_commune_rooms }
                done: { message: Đã thêm phòng. }
            detail:
              title: name
              edit:
                label: Sửa
                form:
                  title: Sửa phòng
                  fields: *room_fields
                  submit: { label: Lưu, update: app_facilities_commune_rooms, version: updated_at }
                  done: { message: Đã lưu phòng. }
