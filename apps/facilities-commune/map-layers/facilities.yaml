# Cấu hình thành phần bản đồ cho trụ sở của xã và của các xã con, theo contracts/map.schema.json; app.yaml trỏ tới
# tệp này ở mục menu `map` và `make check-fast` kiểm. Phần vượt tính cho cả xã (view area_summary), nên mọi trụ sở
# đang dùng của một xã cùng một màu; cơ sở dôi dư không tính vào phần vượt nên có lớp riêng màu xám (ADR 0020).

title: Bản đồ trụ sở
note: Ranh giới, tên xã và vị trí trụ sở là hư cấu, chỉ để minh họa.
# Ranh giới ba xã của "Tỉnh Mẫu" tự vẽ trên vùng nền ghim trong platform/web/basemap.pins, không theo ranh giới hành
# chính nào có thật (ADR 0020). Mỗi đỉnh là [kinh độ, vĩ độ]; tọa độ trụ sở trong seed/demo.yaml nằm trong đúng xã.
areas:
  label: Ranh giới xã (hư cấu)
  color: indigo
  items:
    - name: Xã A
      outline:
        - [106.375, 20.468]
        - [106.388, 20.470]
        - [106.401, 20.470]
        - [106.398, 20.452]
        - [106.403, 20.437]
        - [106.399, 20.421]
        - [106.402, 20.410]
        - [106.386, 20.411]
        - [106.376, 20.414]
        - [106.378, 20.440]
    - name: Xã B
      outline:
        - [106.401, 20.470]
        - [106.415, 20.471]
        - [106.427, 20.470]
        - [106.431, 20.455]
        - [106.426, 20.440]
        - [106.430, 20.424]
        - [106.428, 20.410]
        - [106.414, 20.409]
        - [106.402, 20.410]
        - [106.399, 20.421]
        - [106.403, 20.437]
        - [106.398, 20.452]
    - name: Xã C
      outline:
        - [106.427, 20.470]
        - [106.442, 20.469]
        - [106.455, 20.466]
        - [106.453, 20.440]
        - [106.456, 20.415]
        - [106.442, 20.411]
        - [106.428, 20.410]
        - [106.430, 20.424]
        - [106.426, 20.440]
        - [106.431, 20.455]
layers:
  # Hai lớp của xã truy vấn với vai trò mặc định `user` của giao diện (ADR 0023), nên ai cũng chỉ thấy cơ sở mình được
  # phân công (quyền ở hasura/tables.yaml), kể cả lãnh đạo và quản trị xã.
  - id: in-use
    label: Trụ sở đang dùng
    source: app_facilities_commune_facilities
    latitude: latitude
    longitude: longitude
    title: name
    where: { field: status, equals: in_use }
    # Tên trụ sở dẫn tới chi tiết cơ sở trong danh mục (ADR 0068).
    record: { item: facilities, column: id }
    fields:
      - { name: code, label: Mã }
      - { name: address, label: Địa chỉ }
      - { name: summary.excess_m2, label: Phần vượt của xã (m²), type: number }
    color:
      by: summary.excess_m2
      label: Phần vượt của xã
      steps:
        - { color: teal, label: Không vượt }
        - { above: 0, color: red, label: "Vượt tiêu chuẩn, định mức" }
  - id: surplus
    label: Cơ sở dôi dư
    source: app_facilities_commune_facilities
    latitude: latitude
    longitude: longitude
    title: name
    where: { field: status, equals: surplus }
    record: { item: facilities, column: id }
    fields:
      - { name: code, label: Mã }
      - { name: address, label: Địa chỉ }
    color: { fixed: gray }
  # Tỉnh (tenant cha): trụ sở đang dùng của các xã con qua view facility_rollup, không đọc được bảng gốc của xã.
  - id: communes
    label: Trụ sở đang dùng của các xã
    source: app_facilities_commune_facility_rollup
    role: rollup_reader
    latitude: latitude
    longitude: longitude
    title: name
    fields:
      - { name: tenant_name, label: Xã }
      - { name: code, label: Mã }
      - { name: excess_m2, label: Phần vượt của xã (m²), type: number }
    color:
      by: excess_m2
      label: Phần vượt của xã
      steps:
        - { color: teal, label: Không vượt }
        - { above: 0, color: red, label: "Vượt tiêu chuẩn, định mức" }
