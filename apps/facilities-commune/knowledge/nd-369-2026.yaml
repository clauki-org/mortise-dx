id: nd-369-2026
title: Nghị định 369/2026/NĐ-CP sửa đổi, bổ sung một số điều của Nghị định 155/2025/NĐ-CP
source:
  url: https://datafiles.chinhphu.vn/cpp/files/vbpq/2026/9/369_2026_nd-cp_25092026-signed.signed.pdf
  sha256: 83bb37181f6a8f2c3bcc9a7824321a6501817af8b19e146a18edf6949c918500
  retrieved: 2026-11-27
passages:
  - id: art-2-cl-1
    label: Điều 2 khoản 1, sửa khoản 2 Điều 3 NĐ 155/2025
    text: >-
      Tiêu chuẩn, định mức sử dụng diện tích làm việc phục vụ công tác các chức danh được xác định theo từng chức
      danh, chức vụ. Trường hợp một người giữ nhiều chức danh, chức vụ thì được áp dụng tiêu chuẩn, định mức cao
      nhất.

      Ủy viên Trung ương Đảng dự khuyết đang đảm nhiệm vị trí công tác nào thì được áp dụng tiêu chuẩn, định mức
      sử dụng diện tích làm việc theo chức vụ đang công tác.

      Đối với các chức danh, chức vụ trong các cơ quan, tổ chức, đơn vị chưa được quy định cụ thể tại Phụ lục ban
      hành kèm theo Nghị định này và tại Quy định số 368-QĐ/TW ngày 08 tháng 9 năm 2025 của Bộ Chính trị quy định
      về Danh mục vị trí chức danh, nhóm chức danh, chức vụ lãnh đạo của hệ thống chính trị (sau đây gọi là Quy
      định số 368-QĐ/TW), được điều chỉnh theo Kết luận số 31-KL/TW ngày 11 tháng 5 năm 2026 của Bộ Chính trị về
      việc điều chỉnh phân cấp quản lý cán bộ và Danh mục chức danh lãnh đạo các cơ quan truyền thông, báo chí
      quốc gia, viện hàn lâm khoa học xã hội và khoa học công nghệ phù hợp với yêu cầu trong tình hình mới (sau
      đây gọi là Kết luận số 31-KL/TW) thì căn cứ quy định, quyết định, kết luận hoặc thông báo của cơ quan, người
      có thẩm quyền về chức danh, chức vụ đó tương đương với chức danh, chức vụ nào quy định tại Phụ lục ban hành
      kèm theo Nghị định này hoặc tương đương nhóm, bậc nào tại Quy định số 368-QĐ/TW (được điều chỉnh theo Kết
      luận số 31-KL/TW) để xác định tiêu chuẩn, định mức diện tích làm việc tương ứng.
  - id: art-2-cl-2
    label: Điều 2 khoản 2, sửa khoản 3 Điều 3 NĐ 155/2025
    text: >-
      Diện tích làm việc phục vụ công tác các chức danh, diện tích sử dụng chung, diện tích chuyên dùng, diện tích
      công trình sự nghiệp quy định tại Nghị định này là diện tích được tính theo kích thước thông thủy theo quy
      định của pháp luật, không bao gồm cầu thang, thang máy, thang thoát hiểm, ram dốc, diện tích nhà để xe, diện
      tích tường bao, tường phân chia các phòng làm việc, diện tích sàn có cột, hộp kỹ thuật và tường bao hộp kỹ
      thuật (nếu có) bên trong phòng làm việc, diện tích của vật kiến trúc và các tài sản khác gắn liền với đất
      (trừ nhà).

      Tiêu chuẩn, định mức để thực hiện việc giao, điều chuyển được xác định theo tổng diện tích của các loại diện
      tích này và được tính cho từng cơ quan, tổ chức, đơn vị quản lý, sử dụng tài sản công. Trường hợp cơ quan,
      tổ chức, đơn vị được giao quản lý, sử dụng nhiều trụ sở làm việc, cơ sở hoạt động sự nghiệp thì tiêu chuẩn,
      định mức được xác định trên cơ sở tổng diện tích của toàn bộ trụ sở làm việc, cơ sở hoạt động sự nghiệp được
      giao quản lý, sử dụng.
  # Điều 3 của NĐ 369 bổ sung Điều 3a "Việc rà soát trụ sở làm việc, cơ sở hoạt động sự nghiệp theo tiêu chuẩn,
  # định mức, xử lý đối với phần diện tích lớn hơn so với tiêu chuẩn, định mức (nếu có)"; mỗi khoản một đoạn.
  - id: art-3a-cl-1
    label: Điều 3, bổ sung Điều 3a khoản 1 NĐ 155/2025
    text: >-
      Đối với trường hợp thực hiện sáp nhập, hợp nhất, chia tách, chấm dứt hoạt động; cơ quan quản lý cấp trên của
      cơ quan, tổ chức, đơn vị được giao quản lý, sử dụng tài sản bị giải thể, chấm dứt hoạt động:

      Cơ quan, tổ chức, đơn vị được kế thừa quyền quản lý, sử dụng trụ sở làm việc, cơ sở hoạt động sự nghiệp sau
      khi sáp nhập, hợp nhất; được giao quản lý, sử dụng trụ sở làm việc, cơ sở hoạt động sự nghiệp theo đề
      án/phương án chia tách được cấp có thẩm quyền phê duyệt; được tiếp nhận trụ sở làm việc, cơ sở hoạt động sự
      nghiệp theo đề án/phương án sắp xếp bộ máy được cấp có thẩm quyền phê duyệt; được tiếp tục quản lý, sử dụng
      trụ sở làm việc, cơ sở hoạt động sự nghiệp sau khi chuyển sang trực thuộc cơ quan quản lý cấp trên khác (sau
      đây gọi chung là cơ quan, tổ chức, đơn vị tiếp nhận) có trách nhiệm tiếp nhận nguyên trạng trụ sở làm việc,
      cơ sở hoạt động sự nghiệp. Trong thời hạn 06 tháng, kể từ ngày tiếp nhận, cơ quan, tổ chức, đơn vị tiếp
      nhận có trách nhiệm rà soát để xử lý theo quy định tại khoản 2, khoản 3 Điều này.
  - id: art-3a-cl-2
    label: Điều 3, bổ sung Điều 3a khoản 2 NĐ 155/2025
    text: >-
      Trường hợp trụ sở làm việc, cơ sở hoạt động sự nghiệp tiếp nhận theo quy định tại khoản 1 Điều này có diện
      tích phù hợp với tiêu chuẩn, định mức theo quy định tại Nghị định này hoặc có diện tích lớn hơn so với tiêu
      chuẩn, định mức theo quy định tại Nghị định này mà phần diện tích lớn hơn so với tiêu chuẩn, định mức không
      vượt quá 300 m² thì cơ quan, tổ chức, đơn vị tiếp nhận báo cáo cơ quan, người có thẩm quyền quyết định giao
      theo quy định của pháp luật về quản lý, sử dụng tài sản công để xem xét, quyết định giao cho cơ quan, tổ
      chức, đơn vị mình quản lý, sử dụng và không tính phần diện tích lớn hơn so với tiêu chuẩn, định mức (nếu
      có) vào diện tích của cơ quan, tổ chức, đơn vị tiếp nhận để xác định tiêu chuẩn, định mức.
  - id: art-3a-cl-3
    label: Điều 3, bổ sung Điều 3a khoản 3 NĐ 155/2025
    text: >-
      Trường hợp trụ sở làm việc, cơ sở hoạt động sự nghiệp tiếp nhận theo quy định tại khoản 1 Điều này có diện
      tích lớn hơn so với tiêu chuẩn, định mức theo quy định tại Nghị định này mà phần diện tích lớn hơn so với
      tiêu chuẩn, định mức vượt quá 300 m² thì thực hiện như sau:

      a) Cơ quan, tổ chức, đơn vị tiếp nhận đăng tải thông tin trên Cổng thông tin điện tử của Văn phòng Trung
      ương Đảng, Học viện Chính trị quốc gia Hồ Chí Minh, Đài Truyền hình Việt Nam, Đài Tiếng nói Việt Nam, Thông
      tấn xã Việt Nam, Viện Hàn lâm Khoa học xã hội Việt Nam, Viện Hàn lâm Khoa học và Công nghệ Việt Nam, Văn
      phòng Chủ tịch nước, Văn phòng Quốc hội, Văn phòng Chính phủ, Kiểm toán nhà nước, Ủy ban Trung ương Mặt trận
      Tổ quốc Việt Nam, cơ quan trung ương của các tổ chức chính trị - xã hội, bộ, cơ quan ngang bộ, cơ quan khác
      ở trung ương, Ủy ban nhân dân tỉnh, thành phố (sau đây gọi chung là Cổng thông tin điện tử của bộ, cơ quan
      trung ương, Ủy ban nhân dân cấp tỉnh); thời hạn đăng tải là 30 ngày. Thông tin đăng tải cần nêu rõ về: địa
      chỉ trụ sở làm việc, cơ sở hoạt động sự nghiệp; công năng sử dụng; phần diện tích dự kiến bố trí cho cơ
      quan, tổ chức, đơn vị có nhu cầu tiếp nhận; sơ đồ mặt bằng hoặc tài liệu thể hiện hiện trạng bố trí sử
      dụng; các thông tin khác có liên quan (nếu có).

      b) Trong thời hạn đăng tải 30 ngày, kể từ ngày đăng tải, cơ quan, tổ chức, đơn vị có nhu cầu tiếp nhận gửi
      văn bản đề nghị đến cơ quan, tổ chức, đơn vị tiếp nhận; trong đó thuyết minh rõ: mục đích sử dụng, diện tích
      theo tiêu chuẩn, định mức của cơ quan, tổ chức, đơn vị mình, đề nghị tiếp nhận và thuyết minh sự phù hợp
      giữa diện tích đề nghị tiếp nhận với diện tích dự kiến bố trí của cơ quan, tổ chức, đơn vị tiếp nhận theo
      thông tin đăng tải. Cơ quan, tổ chức, đơn vị có nhu cầu tiếp nhận chịu trách nhiệm về tính chính xác của
      thông tin, số liệu trong văn bản đề nghị.

      c) Trong thời hạn 30 ngày, kể từ ngày hết thời hạn đăng tải, cơ quan, tổ chức, đơn vị tiếp nhận có trách
      nhiệm rà soát, xác định cơ quan, tổ chức, đơn vị đáp ứng điều kiện tiếp nhận theo quy định của Nghị định
      này (sau đây gọi chung là đơn vị có nhu cầu tiếp nhận phù hợp). Việc xác định đơn vị có nhu cầu tiếp nhận
      phù hợp được thực hiện theo thứ tự ưu tiên sau:

      Mục đích sử dụng của đơn vị có nhu cầu tiếp nhận phù hợp với công năng sử dụng của phần diện tích dự kiến
      bố trí và diện tích đề nghị tiếp nhận phù hợp với phần diện tích dự kiến bố trí.

      Các cơ quan, tổ chức, đơn vị thuộc phạm vi quản lý của cơ quan, tổ chức, đơn vị tiếp nhận.

      Các cơ quan, tổ chức, đơn vị thuộc phạm vi quản lý của cơ quan quản lý cấp trên (nếu có) của cơ quan, tổ
      chức, đơn vị tiếp nhận.

      Các cơ quan, tổ chức, đơn vị thuộc phạm vi quản lý của bộ, cơ quan trung ương, tỉnh, thành phố của cơ quan,
      tổ chức, đơn vị tiếp nhận.

      Các cơ quan, tổ chức, đơn vị thuộc phạm vi quản lý của bộ, cơ quan trung ương, tỉnh, thành phố khác (không
      bao gồm bộ, cơ quan trung ương, tỉnh, thành phố của cơ quan, tổ chức, đơn vị tiếp nhận) theo đề nghị tiếp
      nhận của Bộ trưởng, Thủ trưởng cơ quan trung ương, Chủ tịch Ủy ban nhân dân cấp tỉnh.

      Thủ trưởng cơ quan, tổ chức, đơn vị tiếp nhận xem xét, quyết định lựa chọn đơn vị có nhu cầu tiếp nhận phù
      hợp và phối hợp với đơn vị có nhu cầu tiếp nhận phù hợp để báo cáo cơ quan, người có thẩm quyền xem xét,
      quyết định điều chuyển theo quy định của pháp luật về quản lý, sử dụng tài sản công.

      d) Trường hợp hết thời hạn đăng tải mà không có đơn vị có nhu cầu tiếp nhận phù hợp thì cơ quan, tổ chức,
      đơn vị tiếp nhận báo cáo cơ quan, người có thẩm quyền quyết định giao theo quy định của pháp luật về quản
      lý, sử dụng tài sản công để xem xét, quyết định giao nguyên trạng (bao gồm cả phần diện tích lớn hơn so với
      tiêu chuẩn, định mức) cho cơ quan, tổ chức, đơn vị mình quản lý, sử dụng và không tính phần diện tích lớn
      hơn so với tiêu chuẩn, định mức vào diện tích của cơ quan, tổ chức, đơn vị tiếp nhận để xác định tiêu
      chuẩn, định mức. Cơ quan, tổ chức, đơn vị tiếp nhận được quản lý, sử dụng ổn định trụ sở làm việc, cơ sở
      hoạt động sự nghiệp cho đến khi bắt đầu kỳ rà soát 05 năm tiếp theo.
  - id: art-3a-cl-4
    label: Điều 3, bổ sung Điều 3a khoản 4 NĐ 155/2025
    text: >-
      Đối với trụ sở làm việc, cơ sở hoạt động sự nghiệp thực hiện giao, điều chuyển không thuộc trường hợp quy
      định tại khoản 1 Điều này:

      a) Trường hợp điều chuyển trụ sở làm việc, cơ sở hoạt động sự nghiệp do có sự thay đổi về cơ quan quản lý,
      cơ cấu tổ chức, phân cấp quản lý (khi điều chuyển không phải thuyết minh sự phù hợp về tiêu chuẩn, định
      mức) thì trong thời hạn 03 tháng, kể từ ngày tiếp nhận, cơ quan, tổ chức, đơn vị tiếp nhận tài sản điều
      chuyển có trách nhiệm rà soát để xử lý theo quy định tại các khoản 2 và 3 Điều này.

      b) Trường hợp giao, điều chuyển không thuộc điểm a khoản này mà trụ sở làm việc, cơ sở hoạt động sự nghiệp
      thực hiện giao, điều chuyển có diện tích lớn hơn so với tiêu chuẩn, định mức của cơ quan, tổ chức, đơn vị
      có nhu cầu tiếp nhận nhưng không có cơ quan, tổ chức, đơn vị khác có nhu cầu tiếp nhận tại thời điểm quyết
      định giao, điều chuyển thì trên cơ sở đề nghị tiếp nhận nguyên trạng của cơ quan, tổ chức, đơn vị có nhu cầu
      tiếp nhận, cơ quan quản lý cấp trên (nếu có) của cơ quan, tổ chức, đơn vị có nhu cầu tiếp nhận, Bộ trưởng,
      Thủ trưởng cơ quan trung ương, Chủ tịch Ủy ban nhân dân cấp tỉnh của cơ quan, tổ chức, đơn vị có nhu cầu
      tiếp nhận (nếu điều chuyển ngoài phạm vi của bộ, cơ quan trung ương, tỉnh, thành phố), cơ quan, người có
      thẩm quyền quyết định giao, điều chuyển theo quy định của pháp luật về quản lý, sử dụng tài sản công quyết
      định giao, điều chuyển theo nguyên trạng trụ sở làm việc, cơ sở hoạt động sự nghiệp.

      c) Trường hợp trụ sở làm việc, cơ sở hoạt động sự nghiệp thực hiện giao, điều chuyển theo quy định tại
      điểm b khoản này có diện tích phù hợp với tiêu chuẩn, định mức theo quy định tại Nghị định này hoặc có diện
      tích lớn hơn so với tiêu chuẩn, định mức theo quy định tại Nghị định này mà phần diện tích lớn hơn so với
      tiêu chuẩn, định mức không vượt quá 300 m² thì cơ quan, tổ chức, đơn vị tiếp nhận được quản lý, sử dụng
      theo quyết định của cơ quan có thẩm quyền và không tính phần diện tích lớn hơn so với tiêu chuẩn, định mức
      (nếu có) vào diện tích của cơ quan, tổ chức, đơn vị tiếp nhận để xác định tiêu chuẩn, định mức.

      d) Trường hợp trụ sở làm việc, cơ sở hoạt động sự nghiệp thực hiện giao, điều chuyển theo quy định tại
      điểm b khoản này có diện tích lớn hơn so với tiêu chuẩn, định mức theo quy định tại Nghị định này mà phần
      diện tích lớn hơn so với tiêu chuẩn, định mức vượt quá 300 m² thì cơ quan, tổ chức, đơn vị tiếp nhận có
      trách nhiệm xử lý theo quy định tại khoản 3 Điều này.
  # Điều 4 của NĐ 369 bổ sung Điều 3b "Ổn định tiêu chuẩn, định mức trụ sở làm việc, cơ sở hoạt động sự nghiệp".
  - id: art-3b-cl-1
    label: Điều 4, bổ sung Điều 3b khoản 1 NĐ 155/2025
    text: >-
      Tiêu chuẩn, định mức trụ sở làm việc, cơ sở hoạt động sự nghiệp được xác định theo kỳ ổn định 05 năm. Việc
      rà soát được thực hiện một lần trong mỗi kỳ ổn định.

      a) Kỳ rà soát đầu tiên được thực hiện trong quý I năm 2027, thời điểm chốt số liệu là ngày 01 tháng 01 năm
      2027.

      b) Các kỳ rà soát tiếp theo, việc rà soát được thực hiện trong quý I năm đầu tiên của kỳ rà soát, thời điểm
      chốt số liệu là ngày 01 tháng 01 năm đầu tiên của kỳ rà soát đó để áp dụng kết quả từ ngày 01 tháng 01 của
      năm đầu tiên của chu kỳ 05 năm.

      c) Cơ quan, tổ chức, đơn vị đã hoàn thành việc rà soát, xử lý theo quy định tại Điều 3a của Nghị định này
      trong thời hạn 02 năm tính đến ngày 01 tháng 01 của năm đầu tiên của kỳ rà soát tiếp theo thì không phải
      thực hiện rà soát trong kỳ đó; kết quả rà soát trước đó được sử dụng trong suốt kỳ ổn định còn lại.
  - id: art-3b-cl-2
    label: Điều 4, bổ sung Điều 3b khoản 2 NĐ 155/2025
    text: >-
      Diện tích được ổn định trong kỳ là toàn bộ diện tích trụ sở làm việc, cơ sở hoạt động sự nghiệp được cơ
      quan, người có thẩm quyền quyết định giao quản lý, sử dụng, bao gồm:

      a) Diện tích theo tiêu chuẩn, định mức quy định tại Nghị định này.

      b) Phần diện tích lớn hơn so với tiêu chuẩn, định mức đã được cơ quan, người có thẩm quyền quyết định cho
      phép tiếp tục quản lý, sử dụng theo quy định tại Điều 3a và Điều này; không tính phần diện tích lớn hơn so
      với tiêu chuẩn, định mức này vào diện tích của cơ quan, tổ chức, đơn vị khi xác định tiêu chuẩn, định mức.
  - id: art-3b-cl-3
    label: Điều 4, bổ sung Điều 3b khoản 3 NĐ 155/2025
    text: >-
      Việc xác định diện tích trong kỳ ổn định được thực hiện như sau:

      a) Trường hợp trụ sở làm việc, cơ sở hoạt động sự nghiệp có diện tích phù hợp với tiêu chuẩn, định mức theo
      quy định tại Nghị định này hoặc có diện tích lớn hơn so với tiêu chuẩn, định mức theo quy định tại Nghị
      định này mà phần diện tích lớn hơn so với tiêu chuẩn, định mức không vượt quá 300 m² thì cơ quan, tổ chức,
      đơn vị đang quản lý, sử dụng trụ sở làm việc, cơ sở hoạt động sự nghiệp báo cáo cơ quan quản lý cấp trên
      (nếu có) để báo cáo cơ quan, người có thẩm quyền quyết định giao theo quy định của pháp luật về quản lý, sử
      dụng tài sản công cho phép tiếp tục quản lý, sử dụng trụ sở làm việc, cơ sở hoạt động sự nghiệp.

      b) Trường hợp trụ sở làm việc, cơ sở hoạt động sự nghiệp có diện tích lớn hơn so với tiêu chuẩn, định mức
      theo quy định tại Nghị định này mà phần diện tích lớn hơn so với tiêu chuẩn, định mức vượt quá 300 m² thì
      cơ quan, tổ chức, đơn vị thực hiện theo quy định tại khoản 3 Điều 3a Nghị định này.

      Trường hợp hết thời hạn đăng tải mà không có cơ quan, tổ chức, đơn vị có nhu cầu tiếp nhận phù hợp thì báo
      cáo cơ quan quản lý cấp trên (nếu có) để báo cáo cơ quan, người có thẩm quyền quyết định giao theo quy định
      của pháp luật về quản lý, sử dụng tài sản công cho phép tiếp tục quản lý, sử dụng trụ sở làm việc, cơ sở
      hoạt động sự nghiệp.
  - id: art-3b-cl-4
    label: Điều 4, bổ sung Điều 3b khoản 4 NĐ 155/2025
    text: >-
      Diện tích của cơ quan, tổ chức, đơn vị được xác định theo quy định tại khoản 3 Điều này được ổn định trong
      05 năm; trừ các trường hợp sau đây:

      a) Sắp xếp tổ chức bộ máy, sắp xếp đơn vị hành chính theo quyết định của cấp có thẩm quyền.

      b) Thay đổi chức năng, nhiệm vụ, cơ cấu tổ chức làm thay đổi tiêu chuẩn, định mức.

      c) Phát sinh yêu cầu đặc thù về nhiệm vụ, chuyển đổi số, chuyển đổi công năng, bảo đảm quốc phòng, an
      ninh, bảo mật hoặc an toàn thông tin làm thay đổi nhu cầu sử dụng diện tích.

      d) Có cơ quan, tổ chức, đơn vị có nhu cầu tiếp nhận phù hợp và có văn bản đề nghị tiếp nhận phần diện tích
      vượt tiêu chuẩn, định mức theo quy định tại khoản 3 Điều 3a của Nghị định này.

      đ) Việc rà soát để xử lý trong các trường hợp quy định tại các điểm a, b, c và d khoản này được thực hiện
      theo quy định tại các khoản 1, 2 và 3 Điều 3a Nghị định này.
  - id: art-10-cl-3
    label: Điều 10 khoản 3, bãi bỏ trong NĐ 155/2025
    text: >-
      Bãi bỏ một số từ, cụm từ, khoản sau đây:

      a) Bãi bỏ khoản 5 Điều 3.

      b) Bãi bỏ từ “đã” tại khoản 3 Điều 7, khoản 3 Điều 11.

      c) Bãi bỏ cụm từ “công lập” tại tên Chương III.

      d) Bãi bỏ cụm từ “cơ quan thuộc Chính phủ”, “trực thuộc trung ương” tại khoản 5 Điều 15.
  - id: art-11-cl-1
    label: Điều 11 khoản 1
    text: Nghị định này có hiệu lực thi hành từ ngày 11 tháng 11 năm 2026.
