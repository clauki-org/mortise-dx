# Hai view chỉ đọc: mức của từng dòng biên chế kèm trích dẫn, và kết quả của từng xã (được phép, thực tế, phần vượt).
- table: { schema: app_facilities_commune, name: staffing_allowances }
  select_permissions:
    - role: user
      permission:
        columns: [tenant_id, position, headcount, norm_row, norm_title, max_m2, allowed_m2, source, norm_note]
        filter: { tenant_id: { _eq: X-Hasura-Tenant-Id } }

- table: { schema: app_facilities_commune, name: area_summary }
  select_permissions:
    - role: user
      permission:
        columns: [tenant_id, working_allowed_m2, shared_allowed_m2, specialized_allowed_m2, allowed_m2, in_use_m2,
                  surplus_m2, excess_m2]
        filter: { tenant_id: { _eq: X-Hasura-Tenant-Id } }
