#
# Khai báo gói theo contracts/app.schema.json; `make check-fast` kiểm. scripts/app.sh đọc tệp này
# để biết lược đồ, thư mục migration và thư mục metadata Hasura của gói.

id: facilities-commune
name: Cơ sở vật chất xã
version: 0.1.0
description: Cơ sở nhà, đất của xã (cơ sở, tòa, phòng) với diện tích thông thủy và loại diện tích để tính tiêu chuẩn, định mức.
database:
  schema: app_facilities_commune
  migrations: schema/migrations
hasura: hasura
workflows:
  - bpmn/archive-inspection.bpmn20.xml
  - bpmn/facilities-review.bpmn20.xml
rules:
  - rules/archive-humidity.yaml
# Vai trò của bước quyết định trong quy trình rà soát, theo từng xã (ADR 0028); bộ cài chỉ thêm dòng chưa có.
authorities:
  - authorities/facilities-review.yaml
# Giá trị theo luật cho quy trình rà soát (#58): phần vượt trên 300 m² phải công khai 30 ngày (Điều 3a khoản 2, 3 NĐ 155/2025/NĐ-CP, bổ sung bởi Điều 3 NĐ 369/2026/NĐ-CP).
# Demo và CI ghi đè thời hạn khi cài: make app-install APP=facilities-commune SETTINGS=publication_period=PT20S
# (ADR 0019).
settings:
  review_threshold_m2: 300
  publication_period: P30D
menu:
  - id: facilities
    label: Cơ sở nhà, đất
    component: catalog
    config: catalog/facilities.yaml
  # Trụ sở trên bản đồ, tô theo phần vượt của xã; tỉnh thấy trụ sở của các xã con qua lớp có vai trò rollup_reader
  # (ADR 0020, ADR 0024).
  - id: map
    label: Bản đồ trụ sở
    component: map
    config: map-layers/facilities.yaml
  # Trợ lý hỏi dữ liệu (ADR 0027): câu mẫu chạy câu GraphQL chỉ đọc trên diện tích của xã và cơ sở được phân công,
  # bằng token người hỏi; kết quả là bảng kèm câu truy vấn đã chạy.
  - id: ask-data
    label: Hỏi dữ liệu cơ sở
    component: assistant
    config: assistant/ask-data.yaml
  # Cán bộ theo dõi hồ sơ rà soát mình đã lập (ADR 0032). Không gồm hồ sơ kiểm tra kho lưu trữ: hồ sơ đó do tài khoản
  # dịch vụ mở, không có người lập nào.
  - id: reviews
    label: Hồ sơ rà soát đã lập
    component: cases
    config: cases/reviews.yaml
