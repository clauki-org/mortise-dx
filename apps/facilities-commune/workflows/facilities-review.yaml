# Khai báo bước của quy trình rà soát (facilities-review.bpmn20.xml) theo contracts/workflow.schema.json: bảng việc
# đọc tệp này để hiện biểu mẫu và nút của từng bước. Hồ sơ được lập từ nút "Lập hồ sơ rà soát" của
# catalog/facilities.yaml với biến title (tên cơ sở), facilityId (cơ sở) và excessM2 (phần vượt của xã, m²).

process: facilities-review
steps:
  review_report:
    title: title
    form: &review_form
      type: object
      required: [comment]
      properties:
        comment:
          type: string
          title: Ý kiến
    ui: &review_ui
      comment:
        ui:widget: textarea
    actions: &review_actions
      - id: approve
        label: Duyệt
        variables:
          approved: true
      - id: reject
        label: Trả lại
        variables:
          approved: false
    record: &review_record
      menu: facilities
      variable: facilityId
  review_publish:
    title: title
    form: *review_form
    ui: *review_ui
    actions: *review_actions
    record: *review_record
  submit:
    title: title
    form:
      type: object
      required: [recipient]
      properties:
        recipient:
          type: string
          title: Đơn vị đề nghị nhận (theo thứ tự ưu tiên)
        comment:
          type: string
          title: Ý kiến
    ui:
      comment:
        ui:widget: textarea
    actions:
      - id: submit
        label: Trình
        variables:
          submitted: true
    record:
      menu: facilities
      variable: facilityId
  # Người có thẩm quyền theo bảng phân cấp của xã (authorities/facilities-review.yaml) ghi nhận quyết định. Một nút:
  # không có cổng nào sau bước này đọc biến của nút (bpmn/facilities-review.bpmn20.xml). Biến decision riêng, không
  # dùng comment, để không ghi đè ý kiến của bước trình.
  decide:
    title: title
    form:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          title: Quyết định xử lý phần vượt
    ui:
      decision:
        ui:widget: textarea
    actions:
      - id: record
        label: Ghi nhận quyết định
        variables:
          decided: true
    record:
      menu: facilities
      variable: facilityId
