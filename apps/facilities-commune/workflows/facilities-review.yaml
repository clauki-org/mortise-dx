# Khai báo bước của quy trình rà soát (facilities-review.bpmn20.xml) theo contracts/workflow.schema.json: bảng việc
# đọc tệp này để hiện biểu mẫu và nút của từng bước. Hồ sơ được lập từ nút "Lập hồ sơ rà soát" của
# catalog/facilities.yaml với biến title (tên cơ sở), facilityId (cơ sở) và excessM2 (phần vượt của xã, m²).

process: facilities-review
steps:
  review_report:
    title: title
    # Phần vượt người lập gửi; người duyệt đối chiếu với hồ sơ, người lập thấy lại trên trang hồ sơ đã lập.
    details: &review_details
      - { variable: excessM2, label: Phần vượt (m²) }
    form: &review_form
      type: object
      required: [comment]
      properties:
        comment:
          type: string
          title: Ý kiến
    ui: &review_ui
      comment:
        ui:widget: textarea
    actions: &review_actions
      - id: approve
        label: Duyệt
        variables:
          approved: true
      - id: reject
        label: Trả lại
        variables:
          approved: false
    record: &review_record
      menu: facilities
      variable: facilityId
  review_publish:
    title: title
    details: *review_details
    form: *review_form
    ui: *review_ui
    actions: *review_actions
    record: *review_record
  # Đơn vị nhận chọn từ các đăng ký nhận của chính hồ sơ (ADR 0069), đã xếp theo thứ tự ưu tiên của NĐ 155/2025/NĐ-CP
  # Điều 3a khoản 3 điểm c trong view request_board; nhãn mang thứ tự, bậc, hai diện tích và tiêu chí thứ nhất, và
  # chính nhãn đó ghi vào hồ sơ (biến recipient) nên người quyết định đọc được mà không mở CSDL. Không bắt buộc: hết
  # hạn mà không đơn vị nào đăng ký thì vẫn trình được.
  submit:
    title: title
    form:
      type: object
      properties:
        recipient:
          type: string
          title: Đơn vị đề nghị nhận (theo thứ tự ưu tiên)
          description: >-
            Ghi tiêu chí phù hợp công năng, diện tích ở mục "Tin công khai" trước khi chọn. Bỏ trống nếu không đơn vị
            nào đăng ký.
        comment:
          type: string
          title: Ý kiến
    ui:
      comment:
        ui:widget: textarea
    sources:
      recipient:
        table: app_facilities_commune_request_board
        value: choice
        label: choice
        case: case_id
        order: rank
        role: manager
        empty: Không có đơn vị nào đăng ký nhận trong thời hạn công khai; bỏ trống ô này rồi trình.
    actions:
      - id: submit
        label: Trình
        variables:
          submitted: true
    record:
      menu: facilities
      variable: facilityId
  # Người có thẩm quyền theo bảng phân cấp của xã (authorities/facilities-review.yaml) ghi nhận quyết định. Một nút:
  # không có cổng nào sau bước này đọc biến của nút (bpmn/facilities-review.bpmn20.xml). Biến decision riêng, không
  # dùng comment: comment là trường chung của bước duyệt và bước trình, bước nào khai nó cũng ghi được, nên dùng
  # chung thì quyết định ghi đè ý kiến của bước trình. decision chỉ bước này gửi được (formProperty trong BPMN, ADR
  # 0031); required chỉ do giao diện ép, vì workflow-api không kiểm biểu mẫu.
  decide:
    title: title
    details:
      - { variable: recipient, label: Đơn vị đề nghị nhận }
    form:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          title: Quyết định xử lý phần vượt
    ui:
      decision:
        ui:widget: textarea
    actions:
      - id: record
        label: Ghi nhận quyết định
        variables:
          decided: true
    record:
      menu: facilities
      variable: facilityId
