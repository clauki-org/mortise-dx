# Dữ liệu demo HƯ CẤU của ba xã thuộc "Tỉnh Mẫu" (#58): tên, địa chỉ, diện tích đều đặt ra để minh họa, không lấy
# từ cơ quan nào. `make seed-demo` nạp tệp này qua cổng bằng tài khoản quản trị của từng xã (`admin`, vai trò
# tenant_admin), rồi phân công: mỗi tài khoản trong `custodians` phụ trách cơ sở đó, mỗi tài khoản trong `approvers`
# là người duyệt của cơ sở, thấy cơ sở và giấy tờ đính kèm trên danh mục (ADR 0015, ADR 0041) (load.py).
# Tổng diện tích thông thủy của cơ sở đang dùng: xã A 1.000 m², xã B 730 m², xã C 460 m²; xã C còn một cơ sở dôi dư
# 250 m². Biên chế hư cấu, chỉ dùng hai dòng của phụ lục NĐ 369/2026/NĐ-CP có ghi thẳng chức danh (STT 9: chuyên
# viên chính, 20 m²; STT 10: chuyên viên, 15 m²), để không phải xếp chức danh lãnh đạo xã vào bậc nào. Kết quả
# (view area_summary): xã A được phép 580 m² (290 làm việc + 290 sử dụng chung), vượt 420 m²; xã B được phép 600 m²,
# vượt 130 m²; xã C được phép 480 m², không vượt, cơ sở dôi dư 250 m² tính riêng.
# Vị trí (WGS 84) cũng hư cấu: mỗi cơ sở nằm trong ranh giới tự vẽ của xã mình (map-layers/facilities.yaml), trên nền
# bản đồ của một vùng nông thôn có thật, ven một đường liên thôn giữa đồng, xa ngõ xóm, ở chỗ mà dữ liệu OpenStreetMap
# không có nhà, điểm quan tâm hay khu đất nào trong vòng 500 m (cách chọn ở ADR 0020). load.py cập nhật tọa độ cho cơ sở đã nạp từ trước khi gói có cột này.

xa-a:
  admin: admin.a
  staffing:
    - { position: Chuyên viên chính, norm_row: 9, headcount: 4 }
    - { position: Chuyên viên, norm_row: 10, headcount: 14 }
  facilities:
    - code: TS-A1
      name: Trụ sở UBND xã A
      address: Thôn 1, xã A, Tỉnh Mẫu
      status: in_use
      location: { latitude: 20.444500, longitude: 106.395000 }
      custodians: [user.a]
      # Người duyệt xã A mở được trụ sở và giấy tờ của nó: danh mục đọc bằng vai trò user, chỉ thấy cơ sở có phân công.
      approvers: [manager.a]
      buildings:
        - code: NLV
          name: Nhà làm việc
          floors: 2
          rooms:
            - { code: P101, name: Phòng làm việc 101, floor: 1, area_type: working, clear_area_m2: 60 }
            - { code: P102, name: Phòng làm việc 102, floor: 1, area_type: working, clear_area_m2: 60 }
            - { code: P103, name: Phòng làm việc 103, floor: 1, area_type: working, clear_area_m2: 60 }
            - { code: P104, name: Bộ phận một cửa, floor: 1, area_type: shared, clear_area_m2: 120 }
            - { code: P201, name: Phòng làm việc 201, floor: 2, area_type: working, clear_area_m2: 80 }
            - { code: P202, name: Phòng làm việc 202, floor: 2, area_type: working, clear_area_m2: 80 }
            - { code: P203, name: Phòng họp, floor: 2, area_type: shared, clear_area_m2: 140 }
        - code: NPT
          name: Nhà phụ trợ
          floors: 1
          rooms:
            - { code: K01, name: Kho lưu trữ, floor: 1, area_type: shared, clear_area_m2: 60 }
            - { code: H01, name: Hội trường nhỏ, floor: 1, area_type: shared, clear_area_m2: 40 }
    - code: TS-A2
      name: Trụ sở xã cũ (tiếp nhận khi sắp xếp)
      address: Thôn 5, xã A, Tỉnh Mẫu
      status: in_use
      location: { latitude: 20.453000, longitude: 106.394000 }
      custodians: [user.a]
      buildings:
        - code: NLV
          name: Nhà làm việc
          floors: 1
          rooms:
            - { code: P01, name: Phòng làm việc 01, floor: 1, area_type: working, clear_area_m2: 80 }
            - { code: P02, name: Phòng làm việc 02, floor: 1, area_type: working, clear_area_m2: 80 }
            - { code: P03, name: Phòng họp, floor: 1, area_type: shared, clear_area_m2: 90 }
            - { code: P04, name: Kho, floor: 1, area_type: shared, clear_area_m2: 50 }

