# Dữ liệu demo HƯ CẤU của ba xã thuộc "Tỉnh Mẫu" (#58): tên, địa chỉ, diện tích đều đặt ra để minh họa, không lấy
# từ cơ quan nào. `make seed-demo` nạp tệp này qua cổng bằng tài khoản của từng xã (load.py).
# Tổng diện tích thông thủy của cơ sở đang dùng: xã A 1.000 m², xã B 730 m², xã C 460 m²; xã C còn một cơ sở dôi dư
# 250 m². Diện tích được phép và phần vượt tính ở #100, không ghi ở đây.

