# bị sửa hay bãi bỏ khai `superseded_by` nên trợ lý chỉ trích phần đang có hiệu lực.

intro: >-
  Hỏi về rà soát trụ sở theo tiêu chuẩn, định mức: Điều 3 NĐ 155/2025 và Điều 3a, 3b do NĐ 369/2026 bổ sung. Câu
  trả lời kèm câu trích nguyên văn; thiếu căn cứ thì trợ lý từ chối.
examples:
  - Phần diện tích vượt tiêu chuẩn, định mức trên bao nhiêu m² thì phải đăng tải thông tin?
  - Thời hạn đăng tải thông tin trên Cổng thông tin điện tử là bao nhiêu ngày?
  - Kỳ rà soát đầu tiên được thực hiện khi nào?
documents: [nd-155-2025, nd-369-2026]
