# Biểu mẫu lập phiếu xuất (dòng cha, ADR 0062) theo contracts/form.schema.json; app.yaml trỏ tới tệp này ở mục
# menu `issue` (chỉ quản trị) và `make check-fast` kiểm. Gửi thì thêm một dòng vào bảng issues; tenant_id do
# Hasura đặt từ token. Dòng hàng thêm sau, từ màn hình chi tiết của phiếu trong danh mục.

title: Lập phiếu xuất
description: Lập phiếu rồi mở phiếu trong danh mục để thêm từng dòng hàng.
role: tenant_admin
fields:
  - { name: code, label: Số phiếu, type: string, required: true, max_length: 50 }
  - { name: issued_on, label: Ngày xuất, type: date, required: true }
  - { name: partner, label: Giao cho, type: string, max_length: 200 }
  - { name: note, label: Ghi chú, type: string, multiline: true, max_length: 1000 }
submit:
  label: Lập phiếu
  insert: app_supplies_commune_issues
done:
  message: Đã lập phiếu xuất. Mở phiếu để thêm dòng hàng.
  menu: issues
