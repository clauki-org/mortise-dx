# Khai báo bước của quy trình bpmn/supply-request.bpmn20.xml theo contracts/workflow.schema.json: bảng việc vẽ biểu
# mẫu ý kiến và hai nút cho người duyệt; tên đề nghị lấy từ biến title đặt lúc lập, các giá trị người lập điền ở
# forms/supply-request.yaml hiện trong thông tin hồ sơ (details).

process: supply-request
steps:
  approve:
    title: title
    details:
      - { variable: storeCode, label: Mã kho }
      - { variable: itemCode, label: Mã mặt hàng }
      - { variable: quantity, label: Số lượng }
      - { variable: reason, label: Lý do }
    form:
      type: object
      required: [comment]
      properties:
        comment:
          type: string
          title: Ý kiến
    ui:
      comment:
        ui:widget: textarea
    actions:
      - id: approve
        label: Duyệt
        variables:
          approved: true
      - id: reject
        label: Từ chối
        variables:
          approved: false
