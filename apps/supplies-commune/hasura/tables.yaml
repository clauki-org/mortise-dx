# Tồn kho tính trong CSDL (view stock): chỉ đọc; danh mục kho hiện thành bảng "Tồn kho" của từng kho.
- table: { schema: app_supplies_commune, name: stock }
  select_permissions:
    - role: user
      permission:
        columns: &stock_columns [id, tenant_id, store_code, item_code, name, unit, kind, opening, received, issued,
                                 on_hand]
        filter: *tenant
    - role: manager
      permission: { columns: *stock_columns, filter: *tenant }
    - role: tenant_admin
      permission: { columns: *stock_columns, filter: *tenant }
