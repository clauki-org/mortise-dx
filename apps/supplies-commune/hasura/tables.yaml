# Bảng của gói mà Hasura đăng ký và quyền trên chúng; cùng định dạng và cùng cách kiểm như core/hasura/tables.yaml.
# make app-install áp khi cài gói, bỏ đăng ký khi gỡ. Mọi quyền lọc theo tenant trong token:
#   user, manager  chỉ đọc toàn đơn vị (giao diện đọc bằng vai trò user)
#   tenant_admin   đọc, thêm, sửa, xóa; tenant_id gán từ token
# Mã kho không nằm trong cột sửa được: mặt hàng trỏ về kho bằng mã, đổi mã sẽ bị khóa ngoại chặn.

- table: { schema: app_supplies_commune, name: stores }
  select_permissions:
    - role: user
      permission:
        columns: &store_columns [id, tenant_id, code, name, location, created_at]
        filter: &tenant { tenant_id: { _eq: X-Hasura-Tenant-Id } }
    - role: manager
      permission: { columns: *store_columns, filter: *tenant }
    - role: tenant_admin
      permission: { columns: *store_columns, filter: *tenant }
  insert_permissions:
    - role: tenant_admin
      permission:
        columns: [code, name, location]
        check: *tenant
        set: &tenant_from_token { tenant_id: X-Hasura-Tenant-Id }
  update_permissions:
    - role: tenant_admin
      permission: { columns: [name, location], filter: *tenant, check: *tenant }
  delete_permissions:
    - role: tenant_admin
      permission: { filter: *tenant }

- table: { schema: app_supplies_commune, name: items }
  select_permissions:
    - role: user
      permission:
        columns: &item_columns [id, tenant_id, store_code, code, name, unit, kind, quantity, created_at, custom]
        filter: *tenant
    - role: manager
      permission: { columns: *item_columns, filter: *tenant }
    - role: tenant_admin
      permission: { columns: *item_columns, filter: *tenant }
  insert_permissions:
    - role: tenant_admin
      permission:
        columns: [store_code, code, name, unit, kind, quantity, custom]
        check: *tenant
        set: *tenant_from_token
  # Mã vật tư và mã kho của vật tư không sửa được: CSDL không chặn, nhưng cặp (store_code, code) là khóa mà
  # seed/demo.yaml dùng để nhận ra dòng đã nạp, và đề nghị cấp vật tư trỏ về vật tư bằng storeCode, itemCode dạng
  # chữ. Đổi mã hay chuyển kho thì make seed-demo nạp thêm bản trùng, đề nghị đang mở trỏ vào vật tư không còn.
  update_permissions:
    - role: tenant_admin
      permission: { columns: [name, unit, kind, quantity, custom], filter: *tenant, check: *tenant }
  delete_permissions:
    - role: tenant_admin
      permission: { filter: *tenant }

# Phiếu nhập, phiếu xuất và dòng của chúng (ADR 0062): cùng cách chia quyền như kho. Mã phiếu không sửa được vì dòng
# trỏ về phiếu bằng mã. Dòng không có quyền sửa: ghi sai thì xóa dòng rồi thêm lại, để mỗi thay đổi số lượng là một
# lần thêm hay xóa trong nhật ký. CSDL từ chối dòng xuất làm tồn âm, kể cả khi lệnh đi thẳng qua GraphQL.
- table: { schema: app_supplies_commune, name: receipts }
  select_permissions:
    - role: user
      permission:
        columns: &receipt_columns [id, tenant_id, code, received_on, partner, note, created_at]
        filter: *tenant
    - role: manager
      permission: { columns: *receipt_columns, filter: *tenant }
    - role: tenant_admin
      permission: { columns: *receipt_columns, filter: *tenant }
  insert_permissions:
    - role: tenant_admin
      permission: { columns: [code, received_on, partner, note], check: *tenant, set: *tenant_from_token }
  update_permissions:
    - role: tenant_admin
      permission: { columns: [received_on, partner, note], filter: *tenant, check: *tenant }
  delete_permissions:
    - role: tenant_admin
      permission: { filter: *tenant }

