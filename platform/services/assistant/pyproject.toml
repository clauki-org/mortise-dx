[project]
name = "mortise-assistant"
version = "0.1.0"
description = "Trợ lý hỏi văn bản: tìm đoạn theo quyền người hỏi, sinh câu trả lời tại chỗ hay qua API, kiểm câu trích và con số"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
  "pg8000>=1.31",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
