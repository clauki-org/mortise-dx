# Bảng của Tầng 2 mà Hasura đăng ký và quyền trên chúng; cùng định dạng và cùng cách áp như
# core/hasura/tables.yaml.

- table: { schema: platform, name: workflow_steps }
  select_permissions:
    - role: user
      permission:
        columns: [tenant_id, process, step, config]
        filter: { tenant_id: { _eq: X-Hasura-Tenant-Id } }

- table: { schema: platform, name: menu_items }
  select_permissions:
    - role: user
      permission:
        columns: [tenant_id, app, app_name, item, position, label, component, config, roles, icon]
        filter: { tenant_id: { _eq: X-Hasura-Tenant-Id } }

# Văn bản cho trợ lý hỏi văn bản (ADR 0021): trợ lý đọc bằng token người hỏi, nên quyền ở đây quyết định đoạn nào được
# tìm và được trích.
- table: { schema: platform, name: knowledge_documents }
  array_relationships:
    - name: passages
      using:
        manual_configuration:
          remote_table: { schema: platform, name: knowledge_passages }
          column_mapping: { tenant_id: tenant_id, app: app, document_id: document_id }
  select_permissions:
    - role: user
      permission:
        columns: [tenant_id, app, document_id, title, source_url, source_sha256, retrieved]
        filter: { tenant_id: { _eq: X-Hasura-Tenant-Id } }

- table: { schema: platform, name: knowledge_passages }
  object_relationships:
    - name: document
      using:
        manual_configuration:
          remote_table: { schema: platform, name: knowledge_documents }
          column_mapping: { tenant_id: tenant_id, app: app, document_id: document_id }
  select_permissions:
    - role: user
      permission:
        columns: [tenant_id, app, document_id, passage_id, position, label, text, superseded_by_document,
                  superseded_by_passage]
        filter: { tenant_id: { _eq: X-Hasura-Tenant-Id } }

# Nhật ký câu hỏi của trợ lý (ADR 0021, câu hỏi dữ liệu ADR 0027): chỉ quản trị của tenant đọc, chỉ dòng của tenant
# mình; không ai ghi qua GraphQL, dịch vụ trợ lý ghi bằng vai trò CSDL riêng.
- table: { schema: platform, name: assistant_questions }
  select_permissions:
    - role: tenant_admin
      permission:
        columns: [id, tenant_id, asked_at, asked_by, app, documents, question, outcome, answer, reason, citations, model,
                  model_provider, model_host, duration_ms, item, query, row_count, attempts]
        filter: { tenant_id: { _eq: X-Hasura-Tenant-Id } }

# Tenant gốc của mỗi tenant (view). Đăng ký chỉ để quyền của bảng khác đi qua quan hệ tới nó; không vai trò nào đọc
# thẳng.
- table: { schema: platform, name: tenant_roots }

# Trường tùy chỉnh (ADR 0059): một bộ định nghĩa cho mỗi tenant gốc. Mọi tenant cùng gốc đọc được (quan hệ members
# nối định nghĩa với các tenant có gốc đó), để biểu mẫu, danh mục ở xã hiện trường tỉnh đã thêm. Chỉ tenant_admin của
# chính tenant gốc (tenant không có cha) thêm, sửa, xóa; quản trị của tenant con thì không, để mọi đơn vị trong org
# dùng cùng một bộ trường. Mã, kiểu và bảng không sửa được (đổi thì giá trị đã ghi thành sai); CSDL cũng chặn.
- table: { schema: platform, name: custom_fields }
  object_relationships:
    - name: root
      using:
        manual_configuration:
          remote_table: { schema: core, name: tenants }
          column_mapping: { root_tenant_id: id }
  array_relationships:
    - name: members
      using:
        manual_configuration:
          remote_table: { schema: platform, name: tenant_roots }
          column_mapping: { root_tenant_id: root_tenant_id }
  select_permissions:
    - role: user
      permission:
        columns: &custom_field_columns [root_tenant_id, app, source, code, label, kind, choices, required,
                                        created_at, updated_at]
        filter: &same_root { members: { tenant_id: { _eq: X-Hasura-Tenant-Id } } }
    - role: tenant_admin
      permission: { columns: *custom_field_columns, filter: *same_root }
  insert_permissions:
    - role: tenant_admin
      permission:
        columns: [app, source, code, label, kind, choices, required]
        check: &org_admin
          _and:
            - { root_tenant_id: { _eq: X-Hasura-Tenant-Id } }
            - { root: { parent_id: { _is_null: true } } }
        set: { root_tenant_id: X-Hasura-Tenant-Id }
  update_permissions:
    - role: tenant_admin
      permission: { columns: [label, choices, required], filter: *org_admin, check: *org_admin }
  delete_permissions:
    - role: tenant_admin
      permission: { filter: *org_admin }

# Lớp ghi đè cấu hình theo org (ADR 0060). Mọi tenant đọc phần chỉnh của tenant gốc của mình qua view; chỉ tenant_admin
# của chính tenant gốc (tenant không có cha) thêm, sửa giá trị, xóa ("Về mặc định"). Quản trị của tenant con thì không,
# để mọi đơn vị trong org thấy cùng một giao diện. Đích và dạng của giá trị do trigger của bảng kiểm.
- table: { schema: platform, name: config_overrides_by_tenant }
  select_permissions:
    - role: user
      permission:
        columns: &override_columns [tenant_id, root_tenant_id, app, item, kind, target, value, updated_at]
        filter: { tenant_id: { _eq: X-Hasura-Tenant-Id } }
    - role: tenant_admin
      permission: { columns: *override_columns, filter: { tenant_id: { _eq: X-Hasura-Tenant-Id } } }

- table: { schema: platform, name: config_overrides }
  object_relationships:
    - name: root
      using:
        manual_configuration:
          remote_table: { schema: core, name: tenants }
          column_mapping: { root_tenant_id: id }
  # Đọc bảng gốc chỉ để mutation trả lại dòng vừa ghi (returning); giao diện đọc qua view.
  select_permissions:
    - role: tenant_admin
      permission:
        columns: [root_tenant_id, app, item, kind, target, value, updated_at]
        filter: &override_admin
          _and:
            - { root_tenant_id: { _eq: X-Hasura-Tenant-Id } }
            - { root: { parent_id: { _is_null: true } } }
  insert_permissions:
    - role: tenant_admin
      permission:
        columns: [app, item, kind, target, value]
        check: *override_admin
        set: { root_tenant_id: X-Hasura-Tenant-Id }
  # Quyền sửa value để insert kèm on_conflict (ghi đè phần chỉnh đã có) chạy được.
  update_permissions:
    - role: tenant_admin
      permission: { columns: [value], filter: *override_admin, check: *override_admin }
  delete_permissions:
    - role: tenant_admin
      permission: { filter: *override_admin }
