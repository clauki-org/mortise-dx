# Header bảo mật cho mọi phản hồi của giao diện (ADR 0006). Tách riêng vì nginx bỏ add_header của cấp server khi một
# location có add_header của nó; mỗi location trong nginx.conf include tệp này.

# Chỉ cho chạy script từ chính origin. Style cho phép inline vì Mantine gắn biến CSS và thuộc tính style vào trang.
# Không cho trang khác nhúng giao diện. Worker của MapLibre GL JS là tệp cùng origin trong assets/, nên worker-src
# không cần blob: (ADR 0024).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
# Cho trình duyệt cũ không hiểu frame-ancestors; giao diện không dùng camera, micro, vị trí.
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Trang /callback mang mã đăng nhập trong địa chỉ; không gửi địa chỉ đó sang site khác.
add_header Referrer-Policy "same-origin" always;
