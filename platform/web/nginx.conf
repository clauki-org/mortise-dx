# Phục vụ tệp tĩnh của giao diện sau cổng APISIX (ADR 0006). Không có logic phía máy chủ: mọi dữ liệu đi qua /v1 và
# /auth của cổng, nên nginx chỉ trả tệp và gắn header bảo mật.

server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # Tệp trong assets/ có băm nội dung trong tên: đổi nội dung là đổi tên, nên trình duyệt giữ lâu được.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Thương hiệu của bản cài (ADR 0043): brand/ có sẵn trong image, compose gắn thư mục của người vận hành đè lên
    # (MORTISE_BRANDING_DIR). Không giữ trong bộ nhớ đệm để đổi tệp là có hiệu lực ở lần tải trang sau. Thiếu tệp thì
    # trả 404 thay vì rơi xuống index.html: giao diện nhận ra và dùng thương hiệu mặc định.
    location = /branding.json {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files /brand/branding.json =404;
    }

    location /brand/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Đường không phải tệp trả index.html để React dựng đúng màn hình khi tải lại trang. index.html không được giữ
    # trong bộ nhớ đệm để bản build mới có hiệu lực ngay.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
