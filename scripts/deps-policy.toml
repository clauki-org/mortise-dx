"apache/apisix" = "Apache APISIX (standalone)"
"chrislusf/seaweedfs" = "SeaweedFS"
"clamav/clamav" = "ClamAV"
"postgis/postgis" = "PostgreSQL + PostGIS"
"scorpiobroker/all-in-one-runner" = "Scorpio (bản native)"
"eclipse-mosquitto" = "Eclipse Mosquitto"
"ollama/ollama" = "Ollama"
"grafana/grafana" = "Grafana"
"prom/prometheus" = "Prometheus"
"grafana/loki" = "Grafana Loki"
"grafana/alloy" = "Grafana Alloy"
"tecnativa/docker-socket-proxy" = "docker-socket-proxy (Tecnativa)"
