# Image mà phiên bản trong tag có ít hơn ba số (chính, phụ, vá) vẫn được coi là đã ghim, kèm lý do. Kiểm tag trên
# registry ngày 2026-11-25.
[pins.coarse]
"chrislusf/seaweedfs" = "SeaweedFS đánh số phiên bản hai phần (4.52); không có tag nào chi tiết hơn"
"postgis/postgis" = "Tag ổn định chỉ có dạng <Postgres>-<PostGIS chính.phụ> (17-3.6); không có tag bản vá ổn định"
