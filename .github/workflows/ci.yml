#
# Chạy với mọi pull request và mọi push lên main. Các bước kiểm tra chỉ gọi Makefile,
# nên kết quả ở máy và trên CI giống nhau. Job e2e dựng lõi trên máy trắng, đúng như
# người dùng dựng từ mã nguồn; nó mất vài phút nên chỉ chạy khi pull request đổi thứ
# ảnh hưởng tới lõi. Push lên main luôn chạy đủ.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# Workflow chỉ đọc repo; không bước nào push hay đổi cấu hình được.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Fast checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Licenses, compose, shell, YAML, Python
        run: make check-fast
      - name: Unit tests
        run: make test

  web:
    name: Web checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
      - name: Biome, types, build, dependency licenses
        run: make web-check

  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.diff.outputs.core }}
      backup: ${{ steps.diff.outputs.backup }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # core: có tệp nào ngoài tài liệu, giấy phép và mẫu issue không. backup: có đụng tới
      # phần mà sao lưu và khôi phục phụ thuộc không. Không phải pull request thì chạy đủ.
      - id: diff
        name: Compare with the base branch
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"; echo "backup=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          printf '%s\n' "$files"
          docs='(\.md$|^docs/|^LICENSES?|^\.github/ISSUE_TEMPLATE/|^\.editorconfig$|^REUSE\.toml$)'
          backup='(^compose\.yaml$|^core/postgres/|^platform/schema/|^scripts/(backup|restore|writers|files-verify|backup-under-load)\.sh$'
          backup="$backup"'|^Makefile$|^\.env\.example$|^\.github/workflows/)'
          core=false; restore=false
          if printf '%s\n' "$files" | grep -Evq "$docs"; then core=true; fi
          if printf '%s\n' "$files" | grep -Eq "$backup"; then restore=true; fi
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "backup=$restore" >> "$GITHUB_OUTPUT"
          web=false
          if printf '%s\n' "$files" | grep -Eq '(^platform/web/|^Makefile$|^\.github/workflows/)'; then web=true; fi
          echo "web=$web" >> "$GITHUB_OUTPUT"

  e2e:
    name: End-to-end on a clean machine
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RESTORE_CYCLE: ${{ needs.changes.outputs.backup }}
    steps:
      - uses: actions/checkout@v4
      # smoke kiểm token thật theo contracts/ bằng check-jsonschema qua uvx.
      - uses: astral-sh/setup-uv@v6
      - name: Start the core
        run: make up
      - name: Seed demo accounts and permissions
        run: make seed
      - name: Smoke test through the gateway
        run: make smoke
      # Gói Tầng 3 cài vào, kiểm, gỡ ra; lõi phải còn qua smoke sau khi gỡ (ADR 0005).
      - name: Install the commune facilities package and test it
        run: make app-install APP=facilities-commune && make seed-demo && make app-smoke APP=facilities-commune
      # Gói đang cài: seed áp lại quyền của gói, smoke của lõi kiểm cả quyền của gói không lệch khai báo.
      - name: Seed and smoke the core with the package installed
        run: make seed && make smoke
      - name: Uninstall the package, the core still passes
        run: make app-uninstall APP=facilities-commune CONFIRM=yes && make smoke
      # Kịch bản demo trên trình duyệt thật, qua cổng, với giao diện do nginx phục vụ kèm CSP như bản cài thật.
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
      # Trình duyệt Playwright giữ giữa các lần chạy theo package-lock (phiên bản Playwright quyết định bản Chromium).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('platform/web/package-lock.json') }}
      - name: System libraries for the browser
        run: cd platform/web && npm ci --no-audit --no-fund && npx playwright install-deps chromium
      - name: Browser end-to-end tests
        run: make e2e
      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            platform/web/playwright-report
            platform/web/test-results
          retention-days: 7
      # Vòng khôi phục: sao lưu, xóa sạch, dựng lõi trắng, khôi phục, rồi smoke lại.
      # Sao lưu trong khi tải tệp lên liên tục; restore phía dưới kiểm core.files khớp kho tệp (#104).
      - name: Back up while files are being uploaded
        if: env.RESTORE_CYCLE == 'true'
        run: make backup-under-load
        env:
          BACKUP_DIR: ${{ runner.temp }}/backups
      - name: Wipe and start a clean core
        if: env.RESTORE_CYCLE == 'true'
        run: make reset && make up
      - name: Restore
        if: env.RESTORE_CYCLE == 'true'
        run: make restore FROM="$(ls -d "$RUNNER_TEMP"/backups/*/ | head -1)" CONFIRM=yes
      - name: Smoke test after restore
        if: env.RESTORE_CYCLE == 'true'
        run: make smoke
      - name: Service logs
        if: failure()
        run: docker compose logs --tail=200
      - name: Remove containers and data
        if: always()
        run: make reset
