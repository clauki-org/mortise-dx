#
# Chạy với mọi pull request và mọi push lên main. Các bước kiểm tra chỉ gọi Makefile,
# nên kết quả ở máy và trên CI giống nhau. Job e2e dựng lõi trên máy trắng, đúng như
# người dùng dựng từ mã nguồn; nó mất vài phút nên chỉ chạy khi pull request đổi thứ
# ảnh hưởng tới lõi. Push lên main luôn chạy đủ. Diễn tập khôi phục chạy song song với e2e trên một máy trắng khác.
# release.yml gọi lại workflow này (workflow_call) làm cổng kiểm cho mỗi tag phát hành; khi đó mọi job chạy đủ.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

# Workflow chỉ đọc repo; không bước nào push hay đổi cấu hình được.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Fast checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Licenses, compose, shell, YAML, Python, dependency pins
        run: make check-fast
      - name: Unit tests
        run: make test

  web:
    name: Web checks
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
      - name: Biome, types, build, dependency licenses
        run: make web-check
      # Bộ kiểm chung của gói chạy bằng uv; hàm trộn phần chỉnh là mã của giao diện, chạy bằng Node (ADR 0060).
      - uses: astral-sh/setup-uv@v6
      - name: Generated overrides on every package config
        run: make overrides-check

  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.diff.outputs.core }}
      backup: ${{ steps.diff.outputs.backup }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # core: có tệp nào ngoài tài liệu, giấy phép và mẫu issue không. backup: có đụng tới
      # phần mà sao lưu và khôi phục phụ thuộc không. Không phải pull request thì chạy đủ.
      - id: diff
        name: Compare with the base branch
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"; echo "backup=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          printf '%s\n' "$files"
          docs='(\.md$|^docs/|^LICENSES?|^\.github/ISSUE_TEMPLATE/|^\.editorconfig$|^REUSE\.toml$)'
          backup='(^compose\.yaml$|^core/postgres/|^platform/schema/|^scripts/(backup|restore|writers|files-verify|backup-under-load|restore-drill)\.sh$'
          backup="$backup"'|^Makefile$|^\.env\.example$|^\.github/workflows/)'
          core=false; restore=false
          if printf '%s\n' "$files" | grep -Evq "$docs"; then core=true; fi
          if printf '%s\n' "$files" | grep -Eq "$backup"; then restore=true; fi
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "backup=$restore" >> "$GITHUB_OUTPUT"
          web=false
          # apps/, contracts/, scripts/: cấu hình gói, schema hay bộ kiểm đổi thì bài phần chỉnh × cấu hình gói chạy lại.
          web_paths='(^platform/web/|^apps/|^contracts/|^scripts/|^Makefile$|^\.github/workflows/)'
          if printf '%s\n' "$files" | grep -Eq "$web_paths"; then web=true; fi
          echo "web=$web" >> "$GITHUB_OUTPUT"

  e2e:
    name: End-to-end on a clean machine
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    # Ba lượt trên main ngày 2026-11-23 mất 17–18 phút (thời gian job trên GitHub Actions); bước giám sát tải thêm 6
    # image và chờ số liệu.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # smoke kiểm token thật theo contracts/ bằng check-jsonschema qua uvx.
      - uses: astral-sh/setup-uv@v6
      - name: Start the core
        run: make up
      - name: Seed demo accounts and permissions
        run: make seed
      - name: Smoke test through the gateway
        run: make smoke
      # Profile observability (ADR 0037): Prometheus lấy được mọi đích, Loki nhận log, Grafana chỉ ở 127.0.0.1. Bật truy
      # vết cho riêng bước này (ADR 0038; biến ở môi trường thắng .env): obs-check kiểm vết đủ chặng và sạch, smoke chạy
      # lại khi truy vết bật. Cuối bước gỡ profile và dựng lại lõi với truy vết tắt để các bước sau chạy như trước.
      - name: Observability profile with tracing on
        run: |
          MORTISE_TRACING=on make obs-up
          make obs-check
          make smoke
          make obs-down
          make up
      # Tiến trình chính của workflow-api thoát, Docker phải tự dựng lại đúng một lần và smoke vẫn qua.
      - name: A service whose process exits comes back by itself
        run: make heal-check SERVICE=workflow-api
      # Các gói Tầng 3 cài vào, kiểm, gỡ ra; lõi và gói còn lại phải vẫn qua smoke sau khi gỡ (ADR 0005). Thời hạn
      # công khai ngắn để smoke của gói xã chờ được hết hạn (ADR 0019). seed-demo nạp mọi gói có dữ liệu demo nên
      # chạy sau khi các gói đã cài; gói kho và gói vận hành hiện trường chỉ gồm tệp khai báo (ADR 0022). Bản cài CI
      # không có tenant dmt, nên smoke của gói hiện trường chạy trên xã A.
      - name: Install the packages and test them
        run: |
          make app-install APP=facilities-commune SETTINGS=publication_period=PT20S
          make app-install APP=supplies-commune
          make app-install APP=field-ops
          make seed-demo
          make app-smoke APP=facilities-commune && make app-smoke APP=supplies-commune
          make app-smoke APP=field-ops
      # Gói đang cài: seed áp lại quyền của gói, smoke của lõi kiểm cả quyền của gói không lệch khai báo.
      - name: Seed and smoke the core with the packages installed
        run: make seed && make smoke
      # Kịch bản demo trên trình duyệt thật, qua cổng, với giao diện do nginx phục vụ kèm CSP như bản cài thật; hai
      # gói đang cài để có menu và danh mục của gói.
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
      # Trình duyệt Playwright giữ giữa các lần chạy theo package-lock (phiên bản Playwright quyết định bản Chromium).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('platform/web/package-lock.json') }}
      - name: System libraries for the browser
        run: cd platform/web && npm ci --no-audit --no-fund && npx playwright install-deps chromium
      - name: Browser end-to-end tests
        run: make e2e
      - name: Keep the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            platform/web/playwright-report
            platform/web/test-results
          retention-days: 7
      # Gỡ sau e2e: bài trên trình duyệt (platform/web/e2e/) cần gói đang cài. Gỡ gói hiện trường rồi gói kho: lõi và
      # gói xã phải còn qua smoke. Sau đó gỡ gói xã, lõi vẫn qua.
      - name: Uninstall the field operations package, the core still passes
        run: make app-uninstall APP=field-ops CONFIRM=yes && make smoke
      - name: Uninstall the supplies package, the core and the commune package still pass
        run: make app-uninstall APP=supplies-commune CONFIRM=yes && make smoke && make app-smoke APP=facilities-commune
      - name: Uninstall the commune package, the core still passes
        run: make app-uninstall APP=facilities-commune CONFIRM=yes && make smoke
      - name: Service logs
        if: failure()
        run: docker compose logs --tail=200
      - name: Remove containers and data
        if: always()
        run: make reset

  # Diễn tập khôi phục (docs/restore-drill.md): sao lưu trong lúc tải tệp lên, xóa sạch cả image và bộ đệm build, khôi
  # phục mà không dựng lõi trước, smoke; thời gian từng giai đoạn ghi vào tóm tắt của lần chạy. Bản sao lưu chứa .env
  # nên không bao giờ được tải lên làm artifact.
  restore-drill:
    name: Restore drill on a clean machine
    needs: changes
    if: needs.changes.outputs.backup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Start, seed and smoke the core
        run: make up && make seed && make smoke
      - name: Back up, wipe, restore, smoke
        run: make restore-drill CONFIRM=yes
        env:
          BACKUP_DIR: ${{ runner.temp }}/backups
      - name: Service logs
        if: failure()
        run: docker compose --profile observability logs --tail=200
      - name: Remove containers and data
        if: always()
        run: make reset
