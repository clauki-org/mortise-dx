# Nguồn dữ liệu của Grafana, nạp khi Grafana khởi động (ADR 0037). uid cố định để dashboard trong
# grafana/dashboards/ và scripts/obs-check.sh gọi đúng nguồn; không sửa được trên giao diện, đổi thì sửa tệp này.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
