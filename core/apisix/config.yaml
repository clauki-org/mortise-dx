# APISIX chạy chế độ standalone: tuyến đường khai báo trong apisix.yaml,
# không cần etcd và không mở Admin API.

apisix:
  node_listen: 9080
  enable_admin: false

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

nginx_config:
  error_log_level: warn
  # Worker của nginx chỉ thấy biến môi trường được khai ở đây; apisix.yaml đọc biến này trong worker.
  envs:
    - APISIX_TRACE_SAMPLER
  http:
    # Định dạng mặc định của APISIX 3.19.0 thêm trace_id ở cuối, để log của cổng trong Loki nối được sang vết trong
    # Jaeger (ADR 0038). Mã vết luôn có, cả khi tắt truy vết (vết đó không được lưu).
    access_log_format: >-
      $remote_addr - $remote_user [$time_local] $http_host "$request" $status $body_bytes_sent $request_time
      "$http_referer" "$http_user_agent" $upstream_addr $upstream_status $upstream_response_time
      "$upstream_scheme://$upstream_host$upstream_uri" "$apisix_request_id" trace_id=$opentelemetry_trace_id

# Thay danh sách plugin mặc định: opentelemetry không có trong danh sách đó, mà khai `plugins` thì APISIX chỉ nạp đúng
# các plugin liệt kê. Liệt kê mọi plugin apisix.yaml dùng; dùng thêm plugin nào thì thêm vào đây, thiếu thì cấu hình
# chứa plugin đó bị từ chối.
plugins:
  - opentelemetry
  - openid-connect
  - fault-injection
  - limit-count
  - response-rewrite
  - prometheus

# Plugin prometheus (bật cho mọi route ở global_rules trong apisix.yaml) xuất số liệu ở một cổng riêng 9091, không qua
# cổng 9080 của người dùng. Mặc định cổng này chỉ nghe 127.0.0.1 trong container, Prometheus ở container khác không
# lấy được; nghe mọi địa chỉ trong mạng nội bộ của compose, còn compose.yaml không mở 9091 ra máy chủ (ADR 0037).
plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
