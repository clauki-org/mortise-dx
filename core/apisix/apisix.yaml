# Cổng duy nhất của lõi. Mọi API nghiệp vụ phải có access token hợp lệ
# do Keycloak cấp; trang quản trị Keycloak không đi qua cổng này.

upstreams:
  - id: keycloak
    type: roundrobin
    nodes:
      "keycloak:8080": 1
  - id: hasura
    type: roundrobin
    nodes:
      "hasura:8080": 1
  - id: workflow-api
    type: roundrobin
    nodes:
      "workflow-api:8000": 1
  - id: files-api
    type: roundrobin
    nodes:
      "files-api:8000": 1
  - id: context-api
    type: roundrobin
    nodes:
      "context-api:8000": 1
  - id: web
    type: roundrobin
    nodes:
      "web:8080": 1
  # Thời gian chờ đọc lớn hơn ASSISTANT_TIMEOUT_SECONDS (compose.yaml), để dịch vụ tự trả 504 có lý do khi mô hình
  # chậm, thay vì cổng cắt kết nối và trả trang lỗi HTML.
  - id: assistant
    type: roundrobin
    timeout: { connect: 5, send: 30, read: 200 }
    nodes:
      "assistant:8000": 1

# Xác thực dùng chung cho mọi API dưới /v1. Hai route graphql và workflow tham chiếu bộ này, để một token và một lỗi
# 401 có cùng nghĩa ở mọi API.
plugin_configs:
  - id: bearer-token
    plugins:
      openid-connect:
        # bearer_only + use_jwks: cổng tự kiểm chữ ký token bằng JWKS của
        # Keycloak, không gọi introspection nên client_secret không được dùng
        # (schema của plugin vẫn bắt buộc khai báo). client_id cũng không ràng
        # buộc token: token của mọi client trong realm (kể cả mortise-test) đều
        # qua cổng nếu chữ ký và issuer đúng.
        client_id: mortise-web
        client_secret: not-used-bearer-only-jwks
        discovery: http://keycloak:8080/auth/realms/mortise/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
      # openid-connect trả trang HTML khi thiếu hay sai token; client viết theo hợp đồng (ErrorBody trong
      # contracts/workflow-api.openapi.json) cần JSON để hiện lý do và biết phải đăng nhập lại. Plugin không phân biệt
      # 401 đến từ đâu, nên 401 của Hasura hay workflow-api (hiếm, vì cổng đã kiểm token trước) cũng mang lý do chung.
      response-rewrite:
        vars: [["status", "==", 401]]
        headers:
          set:
            Content-Type: application/json
        body: "{\"error\":\"Thiếu hoặc sai access token; đăng nhập lại để lấy token mới.\"}\n"

routes:
  # Chỉ mở các đường OIDC mà ứng dụng và trình duyệt cần của realm mortise (ADR 0007): cấu hình, đăng nhập, token,
  # đăng xuất, khóa công khai, thông tin người dùng, thu hồi token, các bước của form đăng nhập (gồm nhập OTP) và tài
  # nguyên tĩnh của trang đăng nhập. Không mở introspection (cần client có secret), đăng ký client động, device, CIBA,
  # PAR, iframe kiểm phiên, trang tài khoản và realm master. APISIX khớp đường dài nhất trước, nên các đường này
  # thắng route chặn `/auth/*` bên dưới; không cần priority vì không có hai route trùng đường.
  - id: keycloak-oidc
    uris:
      - /auth/realms/mortise/.well-known/openid-configuration
      - /auth/realms/mortise/protocol/openid-connect/auth
      - /auth/realms/mortise/protocol/openid-connect/token
      - /auth/realms/mortise/protocol/openid-connect/logout
      - /auth/realms/mortise/protocol/openid-connect/logout/*
      - /auth/realms/mortise/protocol/openid-connect/certs
      - /auth/realms/mortise/protocol/openid-connect/userinfo
      - /auth/realms/mortise/protocol/openid-connect/revoke
      - /auth/realms/mortise/login-actions/*
      - /auth/resources/*
    upstream_id: keycloak

  # Mọi đường khác của Keycloak (console quản trị, realm master, trang tài khoản...) không lộ qua cổng (zero-trust).
  - id: keycloak-blocked
    uris: ["/auth", "/auth/*"]
    plugins:
      fault-injection:
        abort:
          http_status: 403
          body: "{\"error\":\"forbidden\",\"reason\":\"this identity endpoint is not exposed through the gateway\"}\n"

  # API dữ liệu tự sinh (Hasura). Không token -> 401 tại cổng.
  - id: graphql
    uri: /v1/graphql
    methods: ["POST", "GET", "OPTIONS"]
    upstream_id: hasura
    plugin_config_id: bearer-token
    plugins:
      limit-count:
        count: 600
        time_window: 60
        # Giới hạn theo token, không theo IP: đi qua tunnel hay NAT thì mọi người dùng
        # có cùng một IP, giới hạn theo IP sẽ chặn nhầm cả nhóm. Plugin openid-connect
        # chạy trước nên yêu cầu không token đã bị chặn từ trước.
        key_type: var
        key: http_authorization
        rejected_code: 429

  # API quy trình của lõi (workflow-api trước Flowable). Flowable không có route công khai.
  - id: workflow
    uri: /v1/workflow/*
    methods: ["POST", "GET", "OPTIONS"]
    upstream_id: workflow-api
    plugin_config_id: bearer-token
    plugins:
      limit-count:
        count: 300
        time_window: 60
        key_type: var
        key: http_authorization
        rejected_code: 429

  # API tệp của lõi (files-api trước SeaweedFS). SeaweedFS không có route công khai.
  - id: files
    uris: ["/v1/files", "/v1/files/*"]
    methods: ["POST", "GET"]
    upstream_id: files-api
    plugin_config_id: bearer-token
    plugins:
      limit-count:
        count: 120
        time_window: 60
        key_type: var
        key: http_authorization
        rejected_code: 429

  # Dữ liệu thiết bị theo NGSI-LD (context-api trước Scorpio, ADR 0012), chỉ đọc. Scorpio không có route
  # công khai; ghi dữ liệu không qua cổng (đường MQTT của thiết bị là phần sau của issue #88).
  - id: context
    uri: /v1/context/*
    methods: ["GET"]
    upstream_id: context-api
    plugin_config_id: bearer-token
    plugins:
      limit-count:
        count: 300
        time_window: 60
        key_type: var
        key: http_authorization
        rejected_code: 429

  # Trợ lý hỏi văn bản (ADR 0021). Giới hạn tần suất chặt hơn các API khác: mỗi câu hỏi có thể chiếm mô hình hàng
  # chục giây.
  - id: assistant
    uri: /v1/assistant/*
    methods: ["POST"]
    upstream_id: assistant
    plugin_config_id: bearer-token
    plugins:
      limit-count:
        count: 20
        time_window: 60
        key_type: var
        key: http_authorization
        rejected_code: 429

  # Đường dưới /v1 không khớp API nào trả 404 dạng JSON, không rơi xuống giao diện bên dưới (trả index.html với mã 200
  # sẽ làm lời gọi API sai đường trông như thành công).
  - id: api-unknown
    uris: ["/v1", "/v1/*"]
    plugins:
      fault-injection:
        abort:
          http_status: 404
          body: "{\"error\":\"not_found\",\"reason\":\"no API at this path\"}\n"

  # Giao diện Tầng 2 (tệp tĩnh qua nginx). Đón mọi đường không khớp route nào ở trên; không đòi token vì chỉ trả tệp
  # tĩnh, dữ liệu vẫn phải qua /v1 có token (ADR 0006).
  - id: web
    uris: ["/", "/*"]
    methods: ["GET", "HEAD"]
    upstream_id: web
#END
