# Cổng duy nhất của lõi. Mọi API nghiệp vụ phải có access token hợp lệ
# do Keycloak cấp; trang quản trị Keycloak không đi qua cổng này.

upstreams:
  - id: keycloak
    type: roundrobin
    nodes:
      "keycloak:8080": 1
  - id: hasura
    type: roundrobin
    nodes:
      "hasura:8080": 1

routes:
  # Chặn console quản trị Keycloak từ bên ngoài (zero-trust).
  - id: keycloak-admin-blocked
    uris: ["/auth/admin", "/auth/admin/*"]
    priority: 10
    plugins:
      fault-injection:
        abort:
          http_status: 403
          body: "{\"error\":\"forbidden\",\"reason\":\"admin console is not exposed through the gateway\"}\n"

  # Đăng nhập, cấp token, trang xác thực OIDC.
  - id: keycloak-public
    uri: /auth/*
    priority: 0
    upstream_id: keycloak

  # API dữ liệu tự sinh (Hasura). Không token -> 401 tại cổng.
  - id: graphql
    uri: /v1/graphql
    methods: ["POST", "GET", "OPTIONS"]
    upstream_id: hasura
    plugins:
      openid-connect:
        # bearer_only + use_jwks: cổng tự kiểm chữ ký token bằng JWKS của
        # Keycloak, không gọi introspection nên client_secret không được dùng
        # (schema của plugin vẫn bắt buộc khai báo).
        client_id: dxos-web
        client_secret: not-used-bearer-only-jwks
        discovery: http://keycloak:8080/auth/realms/dxos/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
      limit-count:
        count: 600
        time_window: 60
        # Giới hạn theo token, không theo IP: đi qua tunnel hay NAT thì mọi người dùng
        # có cùng một IP, giới hạn theo IP sẽ chặn nhầm cả nhóm. Plugin openid-connect
        # chạy trước nên yêu cầu không token đã bị chặn từ trước.
        key_type: var
        key: http_authorization
        rejected_code: 429
#END
