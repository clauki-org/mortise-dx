#
# Cổng duy nhất của lõi. Mọi API nghiệp vụ phải có access token hợp lệ
# do Keycloak cấp; trang quản trị Keycloak không đi qua cổng này.

upstreams:
  - id: keycloak
    type: roundrobin
    nodes:
      "keycloak:8080": 1
  - id: hasura
    type: roundrobin
    nodes:
      "hasura:8080": 1
  - id: workflow-api
    type: roundrobin
    nodes:
      "workflow-api:8000": 1

routes:
  # Chỉ mở các đường OIDC mà ứng dụng và trình duyệt cần của realm mortise (ADR 0007): cấu hình, đăng nhập, token,
  # đăng xuất, khóa công khai, thông tin người dùng, thu hồi token, các bước của form đăng nhập (gồm nhập OTP) và tài
  # nguyên tĩnh của trang đăng nhập. Không mở introspection (cần client có secret), đăng ký client động, device, CIBA,
  # PAR, iframe kiểm phiên, trang tài khoản và realm master. APISIX khớp đường dài nhất trước, nên các đường này
  # thắng route chặn `/auth/*` bên dưới; không cần priority vì không có hai route trùng đường.
  - id: keycloak-oidc
    uris:
      - /auth/realms/mortise/.well-known/openid-configuration
      - /auth/realms/mortise/protocol/openid-connect/auth
      - /auth/realms/mortise/protocol/openid-connect/token
      - /auth/realms/mortise/protocol/openid-connect/logout
      - /auth/realms/mortise/protocol/openid-connect/logout/*
      - /auth/realms/mortise/protocol/openid-connect/certs
      - /auth/realms/mortise/protocol/openid-connect/userinfo
      - /auth/realms/mortise/protocol/openid-connect/revoke
      - /auth/realms/mortise/login-actions/*
      - /auth/resources/*
    upstream_id: keycloak

  # Mọi đường khác của Keycloak (console quản trị, realm master, trang tài khoản...) không lộ qua cổng (zero-trust).
  - id: keycloak-blocked
    uris: ["/auth", "/auth/*"]
    plugins:
      fault-injection:
        abort:
          http_status: 403
          body: "{\"error\":\"forbidden\",\"reason\":\"this identity endpoint is not exposed through the gateway\"}\n"

  # API dữ liệu tự sinh (Hasura). Không token -> 401 tại cổng.
  - id: graphql
    uri: /v1/graphql
    methods: ["POST", "GET", "OPTIONS"]
    upstream_id: hasura
    plugins:
      openid-connect:
        # bearer_only + use_jwks: cổng tự kiểm chữ ký token bằng JWKS của
        # Keycloak, không gọi introspection nên client_secret không được dùng
        # (schema của plugin vẫn bắt buộc khai báo). client_id cũng không ràng
        # buộc token: token của mọi client trong realm (kể cả mortise-test) đều
        # qua cổng nếu chữ ký và issuer đúng.
        client_id: mortise-web
        client_secret: not-used-bearer-only-jwks
        discovery: http://keycloak:8080/auth/realms/mortise/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
      limit-count:
        count: 600
        time_window: 60
        # Giới hạn theo token, không theo IP: đi qua tunnel hay NAT thì mọi người dùng
        # có cùng một IP, giới hạn theo IP sẽ chặn nhầm cả nhóm. Plugin openid-connect
        # chạy trước nên yêu cầu không token đã bị chặn từ trước.
        key_type: var
        key: http_authorization
        rejected_code: 429

  # API quy trình của lõi (workflow-api trước Flowable). Flowable không có route công khai.
  - id: workflow
    uri: /v1/workflow/*
    methods: ["POST", "GET", "OPTIONS"]
    upstream_id: workflow-api
    plugins:
      openid-connect:
        client_id: mortise-web
        client_secret: not-used-bearer-only-jwks
        discovery: http://keycloak:8080/auth/realms/mortise/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
      limit-count:
        count: 300
        time_window: 60
        key_type: var
        key: http_authorization
        rejected_code: 429
#END
