[project]
name = "mortise-iot-bridge"
version = "0.1.0"
description = "Nhận số đo thiết bị qua MQTT và ghi vào Scorpio theo NGSI-LD, đúng tenant của chủ đề"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
  "paho-mqtt>=2.1",
  "httpx>=0.28",
  "pg8000>=1.31",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
