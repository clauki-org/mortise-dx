# Mosquitto nhận số đo từ thiết bị (ADR 0012). Chỉ nghe trong mạng compose `ot`, không mở cổng ra máy chủ.
# Mọi kết nối phải có tài khoản; quyền theo từng tài khoản trong tệp acl: thiết bị chỉ gửi vào chủ đề của
# chính nó, cầu nối chỉ đọc. Tệp passwd và acl do start.sh tạo và scripts/device.sh thêm thiết bị.
listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/auth/acl
# Số đo mới thay số đo cũ; không giữ tin khi broker khởi động lại. Tắt tin "retained": nếu không, mỗi lần cầu
# nối kết nối lại, broker giao lại tin cũ và số đo cũ ghi đè số đo mới trong Scorpio.
persistence false
retain_available false
# Tin của thiết bị chỉ vài trăm byte; cầu nối bỏ tin trên 4 KB (core/iot-bridge/app/message.py). Chặn gói lớn
# ngay ở broker để thiết bị không đẩy được tin cỡ trăm MB vào bộ nhớ.
max_packet_size 8192
log_dest stdout
log_type error
log_type warning
log_type notice
