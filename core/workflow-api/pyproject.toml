[project]
name = "mortise-workflow-api"
version = "0.1.0"
description = "Lớp kiểm soát quyền giữa ứng dụng và Flowable: tenant, vai trò, quy tắc bốn mắt"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
