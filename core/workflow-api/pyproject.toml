[project]
name = "mortise-workflow-api"
version = "0.1.0"
description = "Lớp kiểm soát quyền giữa ứng dụng và Flowable: tenant, vai trò, quy tắc bốn mắt, bảng phân cấp"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
  "pg8000>=1.31",
  # Truy vết (ADR 0038): chỉ nạp khi MORTISE_TRACING=on, qua opentelemetry-instrument (Dockerfile). Gói
  # instrumentation còn là bản beta (0.x) nên ghim đúng bản, cùng đợt phát hành với SDK.
  "opentelemetry-api==1.45.2",
  "opentelemetry-sdk==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  "opentelemetry-distro==0.66b2",
  "opentelemetry-instrumentation-fastapi==0.66b2",
  "opentelemetry-instrumentation-logging==0.66b2",
  "opentelemetry-instrumentation-httpx==0.66b2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
