[project]
name = "mortise-files-api"
version = "0.1.0"
description = "Đường vào tệp qua cổng: tải lên, tải xuống, thông tin tệp theo tenant"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "boto3>=1.40",
  "pg8000>=1.31",
  "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
