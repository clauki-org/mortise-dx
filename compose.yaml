# Tầng 1 – lõi headless của DX-OS. Chỉ APISIX mở ra ngoài (cổng 9080);
# các cổng còn lại chỉ bind 127.0.0.1 để quản trị khi phát triển.

name: mortise

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run make env}
      HASURA_DB_PASSWORD: ${HASURA_DB_PASSWORD:?run make env}
      FLOWABLE_DB_PASSWORD: ${FLOWABLE_DB_PASSWORD:?run make env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./core/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mortise"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    restart: unless-stopped
    # start-dev chỉ dùng cho giai đoạn phát triển; bản phát hành chuyển sang `start`.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      # Issuer của token luôn là URL công khai (qua APISIX); dịch vụ nội bộ
      # gọi thẳng keycloak:8080 nhờ backchannel động.
      KC_HOSTNAME: ${MORTISE_PUBLIC_URL:-http://localhost:9080}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run make env}
      # Keycloak thay ${MORTISE_PUBLIC_URL} trong tệp realm khi import: redirect URI và web origin của client
      # giao diện theo URL công khai của bản cài, không dùng ký tự đại diện rộng.
      MORTISE_PUBLIC_URL: ${MORTISE_PUBLIC_URL:-http://localhost:9080}
    volumes:
      - ./core/keycloak/realm-mortise.json:/opt/keycloak/data/import/realm-mortise.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_ADMIN_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  migrate:
    # Chạy một lần mỗi khi `make up`: áp các migration của lõi chưa chạy rồi thoát (ADR 0005).
    # Chạy bằng vai trò hasura, chủ sở hữu CSDL mortise, để bảng thuộc đúng chủ mà Hasura đọc.
    image: ghcr.io/amacneil/dbmate:2.37.0
    restart: "no"
    environment:
      DATABASE_URL: postgres://hasura:${HASURA_DB_PASSWORD}@postgres:5432/mortise?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /migrations
      DBMATE_MIGRATIONS_TABLE: core.schema_migrations
    command: ["--wait", "--no-dump-schema", "--migration-lock", "up", "--strict"]
    volumes:
      - ./core/postgres/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  migrate-platform:
    # Migration của Tầng 2, lịch sử riêng với lõi (ADR 0005). Chạy sau lõi vì bảng của Tầng 2 tham chiếu
    # core.tenants.
    image: ghcr.io/amacneil/dbmate:2.37.0
    restart: "no"
    environment:
      DATABASE_URL: postgres://hasura:${HASURA_DB_PASSWORD}@postgres:5432/mortise?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /migrations
      DBMATE_MIGRATIONS_TABLE: platform.schema_migrations
    command: ["--wait", "--no-dump-schema", "--migration-lock", "up", "--strict"]
    volumes:
      - ./platform/schema/migrations:/migrations:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  hasura:
    # Bản -ce là Community Edition (Apache-2.0); bản không có -ce chứa mã EE.
    image: hasura/graphql-engine:v2.51.4-ce
    restart: unless-stopped
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://hasura:${HASURA_DB_PASSWORD}@postgres:5432/mortise
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:?run make env}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      # Hasura tự kiểm JWT lần nữa sau APISIX (phòng thủ nhiều lớp).
      HASURA_GRAPHQL_JWT_SECRET: >-
        {"jwk_url":"http://keycloak:8080/auth/realms/mortise/protocol/openid-connect/certs",
        "issuer":"${MORTISE_PUBLIC_URL:-http://localhost:9080}/auth/realms/mortise",
        "claims_map":{
        "x-hasura-allowed-roles":{"path":"$$.realm_access.roles"},
        "x-hasura-default-role":{"path":"$$.mortise_default_role","default":"user"},
        "x-hasura-user-id":{"path":"$$.sub"},
        "x-hasura-tenant-id":{"path":"$$.tenant[0]","default":"unassigned"}}}
    ports:
      - "127.0.0.1:${HASURA_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      migrate-platform:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  flowable:
    # Chỉ engine và REST API (Apache-2.0); không dùng giao diện modeler. Sơ đồ BPMN nằm
    # trong repo dưới dạng XML và được deploy theo từng tenant bằng `make seed`.
    image: flowable/flowable-rest:7.2.0
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: ${FLOWABLE_DB_PASSWORD}
      FLOWABLE_REST_APP_ADMIN_USERID: rest-admin
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD:?run make env}
      # Ảnh mặc định tự deploy các quy trình minh họa của Flowable, không thuộc tenant nào.
      # Flowable chỉ chứa quy trình của nền tảng, deploy theo từng tenant.
      FLOWABLE_REST_APP_CREATEDEMODEFINITIONS: "false"
    ports:
      - "127.0.0.1:${FLOWABLE_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Endpoint health của Flowable cũng đòi đăng nhập.
      test:
        - CMD-SHELL
        - >-
          wget -qO- "http://rest-admin:$${FLOWABLE_REST_APP_ADMIN_PASSWORD}@127.0.0.1:8080/flowable-rest/actuator/health"
          | grep -q '"UP"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  workflow-api:
    # Lớp kiểm soát quyền trước Flowable: tenant, vai trò, quy tắc bốn mắt.
    build: core/workflow-api
    restart: unless-stopped
    environment:
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/mortise/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: ${MORTISE_PUBLIC_URL:-http://localhost:9080}/auth/realms/mortise
      FLOWABLE_URL: http://flowable:8080/flowable-rest
      FLOWABLE_USER: rest-admin
      FLOWABLE_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD}
    depends_on:
      keycloak:
        condition: service_healthy
      flowable:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    # Tầng 2: giao diện dựng sẵn thành tệp tĩnh, chỉ vào được qua cổng tại `/` (ADR 0006). Không mở cổng ra máy chủ.
    build: platform/web
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 20

  apisix:
    image: apache/apisix:3.19.0-debian
    restart: unless-stopped
    volumes:
      - ./core/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./core/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "${MORTISE_BIND:-127.0.0.1}:9080:9080"
    depends_on:
      keycloak:
        condition: service_healthy
      hasura:
        condition: service_healthy
      workflow-api:
        condition: service_healthy
      web:
        condition: service_healthy
    # Không có healthcheck thì `docker compose up --wait` trả về ngay khi container vừa
    # chạy, trước khi cổng nạp xong tuyến đường, và lệnh gọi đầu tiên bị ngắt kết nối.
    # Yêu cầu không token tới /v1/graphql phải nhận 401: cổng đang nghe và tuyến đã nạp.
    # /bin/sh của image là dash, không có /dev/tcp, nên gọi bash.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9080 &&
          printf 'GET /v1/graphql HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q ' 401 '
      interval: 5s
      timeout: 5s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run make env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run make env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"mortise","credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -s3 -s3.config=/tmp/s3.json
    volumes:
      - seaweed:/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"

volumes:
  pgdata:
  seaweed:
