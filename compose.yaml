#
# Tầng 1 – lõi headless của DX-OS. Chỉ APISIX mở ra ngoài (cổng MORTISE_PORT, mặc định 9080);
# các cổng còn lại chỉ bind 127.0.0.1 để quản trị khi phát triển.
#
# Dịch vụ tự viết có cả `build` và `image` (ADR 0036). Máy phát triển dựng từ mã nguồn, image mang tên
# `mortise.invalid/<dịch vụ>:dev`: miền `.invalid` không bao giờ phân giải được, nên lần Compose thử kéo trước khi dựng
# không thể lấy nhầm image của ai khác trên Docker Hub. Máy chủ demo đặt MORTISE_IMAGE_PREFIX, MORTISE_VERSION và
# MORTISE_NO_BUILD=1 trong .env để chạy đúng image CI đã đẩy lên GHCR cho tag; `up`, `run` của chúng đi qua
# scripts/compose.sh.

# Tên dự án, mọi cổng mở ra máy chủ và URL công khai đến từ .env, nên hai checkout với hai .env chạy được hai bản cài
# độc lập trên một máy: container, mạng, volume mang tiền tố tên dự án (ADR 0058). Mặc định giữ đúng bản cài một máy.
name: ${COMPOSE_PROJECT_NAME:-mortise}

# Biến truy vết chung của dịch vụ FastAPI tự viết (ADR 0038). MORTISE_TRACING=on thì Dockerfile chạy dịch vụ dưới
# opentelemetry-instrument, các biến OTEL_* dưới đây mới có tác dụng; off thì không gói OpenTelemetry nào được nạp.
x-tracing: &tracing
  MORTISE_TRACING: ${MORTISE_TRACING:-off}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  # Giây. Jaeger chưa chạy thì mỗi lô vết bỏ sau vài giây, trong luồng nền, không chặn yêu cầu.
  OTEL_EXPORTER_OTLP_TIMEOUT: "3"
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  # Tên thuộc tính HTTP theo bản ổn định (url.path, url.query riêng), để Jaeger bỏ đúng chuỗi truy vấn.
  OTEL_SEMCONV_STABILITY_OPT_IN: http
  OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: healthz
  # Dòng log mang trace_id để Grafana nối log trong Loki sang vết. Mức WARNING như khi tắt; không gửi log qua OTLP.
  OTEL_PYTHON_LOG_CORRELATION: "true"
  OTEL_PYTHON_LOG_FORMAT: "%(levelname)s %(name)s: %(message)s trace_id=%(otelTraceID)s"
  OTEL_PYTHON_LOG_LEVEL: warning
  OTEL_PYTHON_LOG_AUTO_INSTRUMENTATION: "false"

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?run make env}
      HASURA_DB_PASSWORD: ${HASURA_DB_PASSWORD:?run make env}
      FLOWABLE_DB_PASSWORD: ${FLOWABLE_DB_PASSWORD:?run make env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./core/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PG_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mortise"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    restart: unless-stopped
    # start-dev chỉ dùng cho giai đoạn phát triển; bản phát hành chuyển sang `start`.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      # Issuer của token luôn là URL công khai (qua APISIX); dịch vụ nội bộ
      # gọi thẳng keycloak:8080 nhờ backchannel động.
      KC_HOSTNAME: ${MORTISE_PUBLIC_URL:-http://localhost:9080}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Số liệu ở cổng quản lý 9000 (/auth/metrics), chỉ trong mạng nội bộ; Prometheus của profile `observability` đọc
      # (ADR 0037). Cổng 9000 không mở ra máy chủ hay qua APISIX.
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run make env}
      # Keycloak thay ${MORTISE_PUBLIC_URL} trong tệp realm khi import: redirect URI và web origin của client
      # giao diện theo URL công khai của bản cài, không dùng ký tự đại diện rộng.
      MORTISE_PUBLIC_URL: ${MORTISE_PUBLIC_URL:-http://localhost:9080}
    volumes:
      - ./core/keycloak/realm-mortise.json:/opt/keycloak/data/import/realm-mortise.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_ADMIN_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  db-roles:
    # Tạo vai trò CSDL của dịch vụ tự viết trước migration, kể cả trên bản cài đã có dữ liệu (core/postgres/roles.sh).
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?run make env}
      FILES_DB_PASSWORD: ${FILES_DB_PASSWORD:?run make env}
      IOT_BRIDGE_DB_PASSWORD: ${IOT_BRIDGE_DB_PASSWORD:?run make env}
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:?run make env}
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:?run make env}
    entrypoint: ["/roles.sh"]
    volumes:
      - ./core/postgres/roles.sh:/roles.sh:ro
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    # Chạy một lần mỗi khi `make up`: áp các migration của lõi chưa chạy rồi thoát (ADR 0005).
    # Chạy bằng vai trò hasura, chủ sở hữu CSDL mortise, để bảng thuộc đúng chủ mà Hasura đọc.
    image: ghcr.io/amacneil/dbmate:2.37.0
    restart: "no"
    environment:
      DATABASE_URL: postgres://hasura:${HASURA_DB_PASSWORD}@postgres:5432/mortise?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /migrations
      DBMATE_MIGRATIONS_TABLE: core.schema_migrations
    command: ["--wait", "--no-dump-schema", "--migration-lock", "up", "--strict"]
    volumes:
      - ./core/postgres/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
      db-roles:
        condition: service_completed_successfully

  migrate-platform:
    # Migration của Tầng 2, lịch sử riêng với lõi (ADR 0005). Chạy sau lõi vì bảng của Tầng 2 tham chiếu
    # core.tenants.
    image: ghcr.io/amacneil/dbmate:2.37.0
    restart: "no"
    environment:
      DATABASE_URL: postgres://hasura:${HASURA_DB_PASSWORD}@postgres:5432/mortise?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /migrations
      DBMATE_MIGRATIONS_TABLE: platform.schema_migrations
    command: ["--wait", "--no-dump-schema", "--migration-lock", "up", "--strict"]
    volumes:
      - ./platform/schema/migrations:/migrations:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  hasura:
    # Bản -ce là Community Edition (Apache-2.0); bản không có -ce chứa mã EE.
    image: hasura/graphql-engine:v2.51.4-ce
    restart: unless-stopped
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://hasura:${HASURA_DB_PASSWORD}@postgres:5432/mortise
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:?run make env}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      # Hasura tự kiểm JWT lần nữa sau APISIX (phòng thủ nhiều lớp).
      HASURA_GRAPHQL_JWT_SECRET: >-
        {"jwk_url":"http://keycloak:8080/auth/realms/mortise/protocol/openid-connect/certs",
        "issuer":"${MORTISE_PUBLIC_URL:-http://localhost:9080}/auth/realms/mortise",
        "claims_map":{
        "x-hasura-allowed-roles":{"path":"$$.realm_access.roles"},
        "x-hasura-default-role":{"path":"$$.mortise_default_role","default":"user"},
        "x-hasura-user-id":{"path":"$$.sub"},
        "x-hasura-tenant-id":{"path":"$$.tenant[0]","default":"unassigned"}}}
    ports:
      - "127.0.0.1:${HASURA_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      migrate-platform:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  flowable:
    # Chỉ engine và REST API (Apache-2.0); không dùng giao diện modeler. Sơ đồ BPMN nằm
    # trong repo dưới dạng XML và được deploy theo từng tenant bằng `make seed`.
    image: flowable/flowable-rest:7.2.0
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: ${FLOWABLE_DB_PASSWORD}
      FLOWABLE_REST_APP_ADMIN_USERID: rest-admin
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD:?run make env}
      # Ảnh mặc định tự deploy các quy trình minh họa của Flowable, không thuộc tenant nào.
      # Flowable chỉ chứa quy trình của nền tảng, deploy theo từng tenant.
      FLOWABLE_REST_APP_CREATEDEMODEFINITIONS: "false"
    ports:
      - "127.0.0.1:${FLOWABLE_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Endpoint health của Flowable cũng đòi đăng nhập.
      test:
        - CMD-SHELL
        - >-
          wget -qO- "http://rest-admin:$${FLOWABLE_REST_APP_ADMIN_PASSWORD}@127.0.0.1:8080/flowable-rest/actuator/health"
          | grep -q '"UP"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  workflow-api:
    # Lớp kiểm soát quyền trước Flowable: tenant, vai trò, quy tắc bốn mắt; vai trò của bước theo bảng phân cấp.
    build: core/workflow-api
    image: ${MORTISE_IMAGE_PREFIX:-mortise.invalid}/workflow-api:${MORTISE_VERSION:-dev}
    restart: unless-stopped
    environment:
      <<: *tracing
      OTEL_SERVICE_NAME: workflow-api
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/mortise/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: ${MORTISE_PUBLIC_URL:-http://localhost:9080}/auth/realms/mortise
      FLOWABLE_URL: http://flowable:8080/flowable-rest
      FLOWABLE_USER: rest-admin
      FLOWABLE_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD}
      # Client Keycloak của dịch vụ được mở quy trình thay cho tenant ghi ở header (ADR 0017), cách nhau dấu phẩy.
      WORKFLOW_SERVICE_CLIENTS: mortise-iot-bridge
      # Chỉ đọc bảng phân cấp thẩm quyền và bảng tenant (ADR 0028).
      WORKFLOW_DB_HOST: postgres
      WORKFLOW_DB_NAME: mortise
      WORKFLOW_DB_USER: workflow_api
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:?run make env}
    depends_on:
      keycloak:
        condition: service_healthy
      flowable:
        condition: service_healthy
      # Bảng phân cấp và quyền đọc của workflow_api do migration của lõi tạo.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20

  files-api:
    # Đường vào tệp của lõi (/v1/files): gán tenant từ token, giới hạn cỡ, lưu nội dung vào SeaweedFS.
    build: core/files-api
    image: ${MORTISE_IMAGE_PREFIX:-mortise.invalid}/files-api:${MORTISE_VERSION:-dev}
    restart: unless-stopped
    environment:
      <<: *tracing
      OTEL_SERVICE_NAME: files-api
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/mortise/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: ${MORTISE_PUBLIC_URL:-http://localhost:9080}/auth/realms/mortise
      FILES_DB_HOST: postgres
      FILES_DB_NAME: mortise
      FILES_DB_USER: files_api
      FILES_DB_PASSWORD: ${FILES_DB_PASSWORD:?run make env}
      S3_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run make env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run make env}
      FILES_BUCKET: mortise-files
      FILES_MAX_BYTES: ${FILES_MAX_BYTES:-20971520}
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      # Thời gian chờ mỗi lần gửi hay nhận với clamd, giây. Lớn hơn MaxScanTime của clamav bên dưới, để tệp quét
      # lâu nhận lý do rõ từ clamd (vượt giới hạn quét) thay vì 503 vì files-api thôi chờ.
      FILES_SCAN_TIMEOUT: ${FILES_SCAN_TIMEOUT:-150}
    depends_on:
      keycloak:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started
      # files-api từ chối mọi tệp khi chưa quét được; chờ clamd nạp xong mẫu nhận diện để
      # `make up` trả về lúc tải lên đã dùng được.
      clamav:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    # Tầng 2: giao diện dựng sẵn thành tệp tĩnh, chỉ vào được qua cổng tại `/` (ADR 0006). Không mở cổng ra máy chủ.
    build: platform/web
    image: ${MORTISE_IMAGE_PREFIX:-mortise.invalid}/web:${MORTISE_VERSION:-dev}
    restart: unless-stopped
    # Thương hiệu của bản cài: thư mục chứa branding.json (contracts/branding.schema.json) và logo, phục vụ ở /brand/
    # (ADR 0043). Gắn cả thư mục, không gắn từng tệp: trình soạn thảo lưu tệp mới thay tệp cũ, và bind mount một tệp
    # sẽ giữ tệp cũ tới khi dựng lại container.
    volumes:
      - ${MORTISE_BRANDING_DIR:-./platform/web/brand}:/usr/share/nginx/html/brand:ro
      # Nền bản đồ do `make basemap` ghi (ADR 0056), ngoài repo vì là dữ liệu tải về. Thư mục trống thì bản đồ vẽ nền
      # trơn. scripts/compose.sh tạo thư mục trước khi dựng: để Docker tự tạo thì thư mục thuộc root và make basemap
      # không ghi vào được.
      - ${MORTISE_BASEMAP_DIR:-${HOME}/.cache/mortise-dx/basemap}:/usr/share/nginx/html/basemap:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 5s
      retries: 20

  apisix:
    image: apache/apisix:3.19.0-debian
    restart: unless-stopped
    environment:
      # Bộ lấy mẫu của plugin opentelemetry (apisix.yaml): MORTISE_TRACING chỉ nhận on hoặc off (ADR 0038).
      APISIX_TRACE_SAMPLER: always_${MORTISE_TRACING:-off}
    volumes:
      - ./core/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./core/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "${MORTISE_BIND:-127.0.0.1}:${MORTISE_PORT:-9080}:9080"
    depends_on:
      keycloak:
        condition: service_healthy
      hasura:
        condition: service_healthy
      workflow-api:
        condition: service_healthy
      files-api:
        condition: service_healthy
      context-api:
        condition: service_healthy
      assistant:
        condition: service_healthy
      web:
        condition: service_healthy
    # Không có healthcheck thì `docker compose up --wait` trả về ngay khi container vừa
    # chạy, trước khi cổng nạp xong tuyến đường, và lệnh gọi đầu tiên bị ngắt kết nối.
    # Yêu cầu không token tới /v1/graphql phải nhận 401: cổng đang nghe và tuyến đã nạp.
    # /bin/sh của image là dash, không có /dev/tcp, nên gọi bash.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9080 &&
          printf 'GET /v1/graphql HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q ' 401 '
      interval: 5s
      timeout: 5s
      retries: 30

  seaweedfs:
    # -volume.max: mặc định chỉ 8 volume, mà mỗi bucket (collection) chiếm vài volume ngay khi ghi tệp đầu, nên
    # bucket thứ hai (kho lạnh, ADR 0014) không ghi được. Volume rỗng không chiếm chỗ đáng kể trên đĩa.
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run make env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run make env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"mortise","credentials":[{"accessKey":"$$S3_ACCESS_KEY","secretKey":"$$S3_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -volume.max=100 -s3 -s3.config=/tmp/s3.json
    volumes:
      - seaweed:/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    healthcheck:
      # Master trả trạng thái cụm khi đã sẵn sàng; công cụ kho lạnh chờ điều này trước khi tạo bucket.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 30

  clamav:
    # Quét mã độc tệp tải lên (ADR 0010); chỉ files-api gọi, không mở cổng ra máy chủ hay qua APISIX.
    # Image không có hậu tố _base kèm sẵn mẫu nhận diện lúc dựng image, nên khởi động được khi không có
    # mạng; có mạng thì freshclam trong container tự tải mẫu mới.
    image: clamav/clamav:1.5.4
    restart: unless-stopped
    environment:
      # Mặc định clamd bỏ qua phần vượt giới hạn quét (tổng dung lượng sau giải nén, số tầng nén, thời gian) mà vẫn
      # báo sạch. Bật để phần vượt giới hạn bị báo và files-api từ chối (ADR 0010).
      CLAMD_CONF_AlertExceedsMax: "yes"
      # Tệp con trong tệp nén lớn hơn MaxFileSize chỉ được quét phần đầu và không bị báo, kể cả khi bật
      # AlertExceedsMax (đã thử với ClamAV 1.5.4). Đặt bằng MaxScanSize để tệp con lớn chạm giới hạn tổng và bị báo.
      CLAMD_CONF_MaxFileSize: "400M"
      CLAMD_CONF_MaxScanSize: "400M"
      # Ghim giá trị mặc định (120 giây, theo clamd.conf.sample của image) để FILES_SCAN_TIMEOUT đặt lớn hơn nó.
      CLAMD_CONF_MaxScanTime: "120000"
    healthcheck:
      # Lệnh kiểm của image (PING tới clamd); image đặt chu kỳ 30 giây, rút ngắn để `make up` không chờ thừa.
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 60

  scorpio-db:
    # CSDL riêng của Scorpio: Scorpio bắt buộc PostGIS, image CSDL chính (pgvector) không có (ADR 0012).
    # Scorpio tự tạo lược đồ và mỗi tenant một CSDL khi tenant đó ghi lần đầu, nên tài khoản cần quyền
    # tạo CSDL; tài khoản chủ của image có quyền đó.
    image: postgis/postgis:17-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: scorpio
      POSTGRES_PASSWORD: ${SCORPIO_DB_PASSWORD:?run make env}
      POSTGRES_DB: scorpio
    volumes:
      - scorpiodata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scorpio -d scorpio"]
      interval: 5s
      timeout: 5s
      retries: 20

  scorpio:
    # Broker NGSI-LD giữ trạng thái thiết bị (ADR 0012). Không xác thực, nên không có route qua cổng:
    # người dùng đọc qua context-api; cổng máy chủ chỉ mở cho người vận hành và smoke.
    # Bản native chỉ có cho amd64; máy ARM chạy qua giả lập của Docker.
    image: scorpiobroker/all-in-one-runner:linux-amd64-6.0.2
    restart: unless-stopped
    environment:
      DBHOST: scorpio-db
      DBUSER: scorpio
      DBPASS: ${SCORPIO_DB_PASSWORD:?run make env}
      DBNAME: scorpio
    depends_on:
      scorpio-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SCORPIO_PORT:-9090}:9090"
    healthcheck:
      # Image không có curl hay wget; hỏi bằng /dev/tcp của bash.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9090 &&
          printf 'GET /ngsi-ld/v1/types HTTP/1.0\r\nAccept: application/json\r\n\r\n' >&3 &&
          read -r status <&3 && [[ $$status == *" 200 "* ]]
      interval: 5s
      timeout: 5s
      retries: 30

  context-api:
    # Đường đọc dữ liệu thiết bị của lõi (/v1/context): kiểm token, gắn tenant từ token, chỉ đọc.
    build: core/context-api
    image: ${MORTISE_IMAGE_PREFIX:-mortise.invalid}/context-api:${MORTISE_VERSION:-dev}
    restart: unless-stopped
    environment:
      <<: *tracing
      OTEL_SERVICE_NAME: context-api
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/mortise/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: ${MORTISE_PUBLIC_URL:-http://localhost:9080}/auth/realms/mortise
      SCORPIO_URL: http://scorpio:9090
    depends_on:
      keycloak:
        condition: service_healthy
      scorpio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20

  mosquitto:
    # Nhận số đo từ thiết bị qua MQTT (ADR 0012). Chỉ nằm trong mạng `ot`, tách khỏi các dịch vụ nghiệp vụ;
    # không mở cổng ra máy chủ hay qua APISIX. Tài khoản thiết bị cấp bằng `make device-add`.
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/mosquitto/config/start.sh"]
    environment:
      MQTT_BRIDGE_PASSWORD: ${MQTT_BRIDGE_PASSWORD:?run make env}
    volumes:
      - ./core/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./core/mosquitto/start.sh:/mosquitto/config/start.sh:ro
      - mqttauth:/mosquitto/auth
    networks: [ot]
    healthcheck:
      # Đăng nhập bằng tài khoản cầu nối và gửi một gói rỗng (không có quyền ghi nên broker bỏ): thoát 0 nghĩa là
      # broker chạy và nhận tài khoản. Không đọc $$SYS vì đó là tin retained, đã tắt trong mosquitto.conf.
      test: ["CMD-SHELL", "mosquitto_pub -u iot-bridge -P \"$$MQTT_BRIDGE_PASSWORD\" -t mortise/health -n -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  iot-bridge:
    # Cầu nối MQTT sang Scorpio: tenant lấy từ chủ đề, chỉ ghi cho tenant có trong core.tenants (ADR 0012); sau đó
    # xét luật ngưỡng và mở hồ sơ qua workflow-api.
    # Nằm ở cả hai mạng: nhận tin trong `ot`, ghi vào Scorpio và đọc CSDL trong mạng mặc định.
    build: core/iot-bridge
    image: ${MORTISE_IMAGE_PREFIX:-mortise.invalid}/iot-bridge:${MORTISE_VERSION:-dev}
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: iot-bridge
      MQTT_PASSWORD: ${MQTT_BRIDGE_PASSWORD:?run make env}
      SCORPIO_URL: http://scorpio:9090
      BRIDGE_DB_HOST: postgres
      BRIDGE_DB_NAME: mortise
      BRIDGE_DB_USER: iot_bridge
      BRIDGE_DB_PASSWORD: ${IOT_BRIDGE_DB_PASSWORD:?run make env}
      # Mở hồ sơ khi số đo vượt ngưỡng (core.threshold_rules), bằng tài khoản dịch vụ do `make seed` tạo (ADR 0017).
      # Gọi thẳng trong mạng nội bộ; token xin ở đây vẫn mang issuer công khai vì Keycloak đặt KC_HOSTNAME.
      WORKFLOW_URL: http://workflow-api:8000
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/auth/realms/mortise/protocol/openid-connect/token
      BRIDGE_CLIENT_ID: mortise-iot-bridge
      BRIDGE_CLIENT_SECRET: ${IOT_BRIDGE_CLIENT_SECRET:?run make env}
    depends_on:
      mosquitto:
        condition: service_healthy
      scorpio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [default, ot]
    healthcheck:
      # Tệp do cầu nối tạo khi đã kết nối và đăng ký nhận tin xong, xóa khi mất kết nối.
      test: ["CMD", "test", "-f", "/tmp/iot-bridge-ready"]
      interval: 5s
      timeout: 3s
      retries: 30

  simulator:
    # Bộ giả lập thiết bị demo (devices/simulator, ADR 0012): đăng nhập Mosquitto bằng tài khoản của từng thiết
    # bị như thiết bị thật. Chỉ chạy khi gọi: `make simulate` (lặp) hoặc trong `make smoke` (một lượt).
    build: devices/simulator
    image: ${MORTISE_IMAGE_PREFIX:-mortise.invalid}/simulator:${MORTISE_VERSION:-dev}
    profiles: [simulator]
    environment:
      DEMO_DEVICE_PASSWORD: ${DEMO_DEVICE_PASSWORD:?run make env}
      SIMULATOR_DEVICES: /srv/devices/devices.yaml
    # Cả thư mục, để danh sách thiết bị của một mẫu cài (ví dụ dien-mat-troi.yaml) chọn được bằng --devices.
    volumes:
      - ./devices/simulator:/srv/devices:ro
    networks: [ot]
    depends_on:
      mosquitto:
        condition: service_healthy

  ollama:
    # Chạy mô hình ngôn ngữ tại chỗ cho trợ lý hỏi văn bản (ADR 0021). Chỉ chạy khi bật profile `ai` bằng `make ai-up`,
    # vì cần nhiều RAM; lõi chạy đủ khi không có nó. Không mở cổng ra máy chủ hay qua APISIX: chỉ dịch vụ trong mạng
    # nội bộ gọi. Trọng số nằm trong volume `ollama`, tải lại được nên không nằm trong bản sao lưu.
    image: ollama/ollama:0.40.16
    profiles: [ai]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      # `ollama list` hỏi máy chủ Ollama trong container; thoát 0 khi máy chủ đã nhận lệnh.
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  assistant:
    # Trợ lý hỏi văn bản và hỏi dữ liệu (ADR 0021, ADR 0027, ADR 0034), sau cổng tại /v1/assistant. Đọc văn bản và dữ
    # liệu qua cổng bằng token của người hỏi; tài khoản CSDL `assistant` chỉ thêm được dòng vào nhật ký câu hỏi. Mặc
    # định gọi Ollama trong mạng nội bộ; chạy cùng lõi; Ollama ở profile `ai` (`make ai-up`), chưa bật thì dịch vụ trả
    # 503 kèm cách bật cho câu hỏi cần mô hình.
    build: platform/services/assistant
    image: ${MORTISE_IMAGE_PREFIX:-mortise.invalid}/assistant:${MORTISE_VERSION:-dev}
    restart: unless-stopped
    environment:
      <<: *tracing
      OTEL_SERVICE_NAME: assistant
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/mortise/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: ${MORTISE_PUBLIC_URL:-http://localhost:9080}/auth/realms/mortise
      ASSISTANT_GRAPHQL_URL: http://apisix:9080/v1/graphql
      OLLAMA_URL: http://ollama:11434
      ASSISTANT_MODELS_FILE: /srv/models.txt
      # Nhà cung cấp mô hình: trống là `ollama`; `openai-compatible` gửi câu hỏi và các câu đã tìm ra API ở
      # ASSISTANT_LLM_BASE_URL, cần đủ ba biến sau, thiếu thì trả 503 chỉ biến còn thiếu (ADR 0021, bổ sung
      # 2026-11-22). Khai trong .env; `make env` không sinh khóa.
      ASSISTANT_LLM_PROVIDER: ${ASSISTANT_LLM_PROVIDER:-}
      ASSISTANT_LLM_BASE_URL: ${ASSISTANT_LLM_BASE_URL:-}
      ASSISTANT_LLM_MODEL: ${ASSISTANT_LLM_MODEL:-}
      ASSISTANT_LLM_API_KEY: ${ASSISTANT_LLM_API_KEY:-}
      ASSISTANT_DB_HOST: postgres
      ASSISTANT_DB_NAME: mortise
      ASSISTANT_DB_USER: assistant
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:?run make env}
      # Giới hạn và ngưỡng là điểm xuất phát, chưa đo; đo lại bằng bộ câu hỏi có đáp án trước khi dùng thật.
      # Độ dài câu hỏi tối đa, ký tự.
      ASSISTANT_MAX_QUESTION_CHARS: "500"
      # Đoạn phải có ít nhất phần này của trọng số từ khóa trong câu hỏi (0 tới 1) mới được làm căn cứ.
      ASSISTANT_MIN_SCORE: "0.35"
      # Số đoạn tối đa đưa cho mô hình.
      ASSISTANT_TOP_PASSAGES: "4"
      ASSISTANT_NUM_PREDICT: "400"
      # Thời gian chờ mô hình, giây; nhỏ hơn thời gian chờ đọc của upstream assistant trong core/apisix/apisix.yaml
      # (200 giây). Câu hỏi dữ liệu gõ tự do (ADR 0034) dùng số này làm hạn chung cho cả lượt viết câu và lượt sửa;
      # cộng thời gian chờ đã cấu hình của việc đọc mục menu và chạy câu qua Hasura (10 giây mỗi lời gọi, data_run.py)
      # và ghi nhật ký (10 giây, journal.py), tổng vẫn dưới 200 giây của cổng. Tăng số này thì tăng cả thời gian chờ
      # đọc ở cổng.
      ASSISTANT_TIMEOUT_SECONDS: "150"
      # Mức log của dịch vụ: INFO ghi một dòng mỗi lời gọi mô hình (nhà cung cấp, số token, lý do dừng, thời gian),
      # không kèm nội dung; DEBUG thêm lý do mô hình tự ghi khi viết câu truy vấn, chỉ để gỡ lỗi.
      ASSISTANT_LOG_LEVEL: ${ASSISTANT_LOG_LEVEL:-INFO}
    volumes:
      - ./core/ollama/models.txt:/srv/models.txt:ro
    # Không chờ Ollama: lõi phải khởi động được khi không bật profile `ai`. Không phụ thuộc apisix: cổng chỉ cần lúc có
    # câu hỏi, và apisix đã chờ dịch vụ này.
    depends_on:
      keycloak:
        condition: service_healthy
      # Bảng nhật ký câu hỏi do migration của Tầng 2 tạo.
      migrate-platform:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20

  cold-archive:
    # Công cụ kho lạnh của người vận hành (ADR 0014): xuất nhật ký thay đổi cũ sang Parquet trên SeaweedFS và truy
    # vấn bằng DuckDB. Chỉ chạy khi gọi (`make archive`, `make cold-query`); không có route qua cổng vì tệp chứa
    # giá trị trước và sau của mọi tenant. Dùng tài khoản postgres như `make backup`.
    build: core/cold-archive
    image: ${MORTISE_IMAGE_PREFIX:-mortise.invalid}/cold-archive:${MORTISE_VERSION:-dev}
    profiles: [tools]
    environment:
      COLD_DB_HOST: postgres
      COLD_DB_NAME: mortise
      COLD_DB_USER: postgres
      COLD_DB_PASSWORD: ${POSTGRES_PASSWORD:?run make env}
      COLD_S3_ENDPOINT: seaweedfs:8333
      COLD_BUCKET: mortise-cold
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run make env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run make env}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  basemap:
    # Công cụ cắt nền bản đồ lúc cài (ADR 0056): `make basemap` gọi `pmtiles extract` để đọc đúng phần của vùng từ
    # bản dựng OpenStreetMap đã ghim (yêu cầu Range qua HTTPS), ghi vào thư mục mà web phục vụ ở /basemap/. Image
    # chính thức ghim cả tag lẫn digest. Chỉ chạy khi gọi; không cần lõi đang chạy.
    image: protomaps/go-pmtiles:v1.31.2@sha256:06574f01f55a78f78f887bc7ebf729a5c093c0d6e17d9876300cfcb0758b59d3
    profiles: [tools]
    volumes:
      - ${MORTISE_BASEMAP_DIR:-${HOME}/.cache/mortise-dx/basemap}:/basemap

  # Profile `observability` (ADR 0037): số liệu, log và sức khỏe của lõi trên một trang Grafana cho người vận hành.
  # Chỉ chạy khi gọi `make obs-up`; lõi chạy đủ khi không có nó. Chỉ Grafana mở cổng, và chỉ ở 127.0.0.1.
  grafana:
    image: grafana/grafana:13.3.1
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Chỉ áp dụng khi volume `grafanadata` còn trống; đổi trong .env sau đó không đổi mật khẩu đã lưu.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Không gửi thống kê, không hỏi bản mới hay tin tức từ grafana.com.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./core/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./core/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  prometheus:
    # Đích lấy số liệu ở core/observability/prometheus.yml. Không mở cổng ra máy chủ; xem qua Grafana.
    image: prom/prometheus:v3.16.0
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Thời gian giữ số liệu là điểm xuất phát, chưa đo dung lượng đĩa.
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./core/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 5s
      retries: 30

  loki:
    # Kho log, một tiến trình, lưu trên volume (core/observability/loki.yaml). Image không có shell hay công cụ HTTP
    # nên không có healthcheck; `make obs-check` chờ Loki trả log.
    image: grafana/loki:3.7.10
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./core/observability/loki.yaml:/etc/loki/loki.yaml:ro
      - lokidata:/loki

  jaeger:
    # Lưu vết phân tán (ADR 0038), cấu hình ở core/observability/jaeger.yaml. APISIX và dịch vụ tự viết gửi vết tới cổng
    # OTLP 4318 khi MORTISE_TRACING=on; Grafana đọc ở cổng 16686. Không mở cổng nào ra máy chủ.
    image: jaegertracing/jaeger:2.20.0
    profiles: [observability]
    restart: unless-stopped
    command: ["--config", "/etc/jaeger/jaeger.yaml"]
    volumes:
      - ./core/observability/jaeger.yaml:/etc/jaeger/jaeger.yaml:ro
      # Gắn ở /tmp: thư mục duy nhất của image mà uid 10001 ghi được, volume mới nhận quyền của nó.
      - jaegerdata:/tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  alloy:
    # Thu log container của dự án qua docker-socket-proxy, đẩy vào Loki (core/observability/alloy/config.alloy).
    # Nghe 0.0.0.0 để Prometheus lấy số liệu của chính Alloy; cổng không mở ra máy chủ.
    image: grafana/alloy:v1.22.0
    profiles: [observability]
    restart: unless-stopped
    environment:
      # config.alloy chỉ thu log của container mang nhãn dự án này, để bản cài thứ hai trên cùng máy không đọc log của
      # bản kia (ADR 0058).
      MORTISE_COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-mortise}
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --disable-reporting
    volumes:
      - ./core/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Vị trí đã đọc trong log của từng container; mất thì Alloy đọc lại và gửi trùng.
      - alloydata:/var/lib/alloy/data
    networks: [default, docker-api]
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
      loki:
        condition: service_started

  docker-socket-proxy:
    # Chỉ cho Alloy đọc danh sách, thông tin, log của container và danh sách mạng; mọi lệnh ghi (POST) và API khác bị
    # chặn. Đọc thông tin container vẫn thấy biến môi trường, gồm bí mật của lõi, nên proxy chỉ nằm trong mạng
    # `docker-api` riêng với Alloy (ADR 0037). Docker rootless hay socket ở chỗ khác: đặt DOCKER_SOCK trong .env.
    image: tecnativa/docker-socket-proxy:v0.5.0
    profiles: [observability]
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      POST: "0"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
    networks: [docker-api]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  blackbox:
    # Hỏi endpoint sức khỏe của dịch vụ không có số liệu riêng (core/observability/blackbox.yml); Prometheus gọi nó.
    image: prom/blackbox-exporter:v0.29.1
    profiles: [observability]
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox_exporter/config.yml"]
    volumes:
      - ./core/observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9115/-/healthy"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  # Mạng của thiết bị: không có đường ra internet, và các dịch vụ khác của lõi không nằm trong đó.
  ot:
    internal: true
  # Mạng giữa Alloy và docker-socket-proxy: không ra internet, dịch vụ khác của lõi không gọi được proxy.
  docker-api:
    internal: true
volumes:
  pgdata:
  mqttauth:
  scorpiodata:
  seaweed:
  ollama:
  grafanadata:
  prometheusdata:
  lokidata:
  alloydata:
  jaegerdata:
