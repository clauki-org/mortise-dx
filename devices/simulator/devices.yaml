# Thiết bị demo: `make seed` cấp tài khoản MQTT cho từng thiết bị (scripts/device.sh, mật khẩu
# DEMO_DEVICE_PASSWORD), bộ giả lập gửi số đo thay cho chúng. Tenant phải có trong core.tenants.
# Số đo (measurements) là tên thuộc tính NGSI-LD mà thiết bị gửi.

- tenant: xuong-a
  device: archive-01
  measurements: [temperature, humidity]
- tenant: xuong-a
  device: room-101
  measurements: [occupied]
- tenant: xuong-a
  device: meter-01
  measurements: [energy]
- tenant: xuong-b
  device: archive-01
  measurements: [temperature, humidity]
