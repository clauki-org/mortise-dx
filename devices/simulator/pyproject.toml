[project]
name = "mortise-device-simulator"
version = "0.1.0"
description = "Bộ giả lập thiết bị demo: gửi số đo qua MQTT như thiết bị thật"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
  "paho-mqtt>=2.1",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S311"]
